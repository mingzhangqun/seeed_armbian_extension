name: "Images - Release"

# Promote a pre-release to Stable (tag-addressed mirror layout):
#   1. pick the pre-release — newest by default, or the explicit `tag`
#      input (use it when a newer build landed after the on-device
#      verification you actually ran)
#   2. GUARD: slots.json pre-release must name the same tag — the
#      manifest index and the release list must agree before anything
#      moves
#   3. VALIDATE the tag's tree: every <board>/<sec>/<kind>/ (sec =
#      plain|secure, kind = recovery|ab|loaders) holds >=1 *.img.xz
#      with a .sha256 sibling and a non-empty ota/, no strays, and the
#      tree's manifest.json is signed with the tag and covers every
#      file both ways
#   4. PUBLISH the GitHub release (prerelease → released)
#   5. FLIP slots.json: history ⟵ [stable] + history[:N-1] capped at
#      HISTORY_DEPTH (default 1), stable ⟵ TAG, pre-release ⟶ null —
#      one small pointer write; loaders ride along (they live INSIDE
#      the tag's tree — one build, one purge unit)
#   6. GC unreferenced trees (payload + in-tree manifest drop in one
#      purge; history tags stay referenced), and any legacy slot dirs
#      an old-code build left behind
#   7. clean up superseded pre-releases; push the images page
#
# IDEMPOTENT RECOVERY — "no pre-release found" can mean three things:
#   heal         slots.pre-release names the newest STABLE release →
#                a previous run died between publishing and the flip
#                (in that window the pointer is the tag, NOT null) →
#                complete the flip, GC, cleanup, pages (mode=heal)
#   recover-page slots.pre-release is null and slots.stable already
#                names the newest stable → a previous run died after
#                the flip but before pages → redeploy the page only
#   anything else is a real failure and aborts.
#
# OneDrive-only: without RCLONE_CONFIG there is nothing to promote.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote (default: newest pre-release)"
        required: false
        type: string

concurrency:
  group: images-mirror
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      target_repo: ${{ steps.rel.outputs.target_repo }}
      has_rclone: ${{ steps.probe.outputs.has_rclone }}
      mode: ${{ steps.rel.outputs.mode }}
    steps:
      - name: Probe secrets
        id: probe
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG" ]; then
            echo "has_rclone=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rclone=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone (seeed-storage OneDrive remote)
        # Reads the rclone config from the repo's own setup-onedrive action
        # inputs — NOT from secrets.RCLONE_CONFIG. secrets.* is not allowed
        # in step-level if:, but action inputs are evaluated before if: and
        # pass secrets through fine; rclone_conf then reads the file the
        # action wrote. Keeps rclone usable inside Resolve for recovery.
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Resolve the tag and guard
        id: rel
        env:
          # The target repo (<owner>/armbian-build) is always cross-repo from
          # here: needs RELEASE_GH_TOKEN (PAT with contents:write).
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG" ]; then
            echo "::error::RCLONE_CONFIG is not set — promotion requires the OneDrive mirror. GitHub-assets-mode (fork) releases are promoted by hand in the UI."
            exit 1
          fi
          # RCLONE_CONFIG env can't hold the secret (secrets.* is not allowed
          # in the step-level if: above); the setup-onedrive action already
          # wrote it to disk, so point rclone at that file instead.
          export RCLONE_CONFIG="$HOME/.config/rclone/rclone.conf"

          # slots.json is both the mirror state and the migration marker:
          # unreadable means the mirror is down or still on the legacy
          # slot layout — either way there is nothing to promote.
          # The mirror is namespaced per pipeline owner (fork and
          # upstream each own armbian/<owner>/images).
          if ! slots_raw="$(rclone cat "seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}/images/slots.json" --contimeout 15s)"; then
            echo "::error::slots.json unreadable — OneDrive unreachable, or the mirror's pointer file is gone. Restore it by hand: list trees/, then write {stable, pre-release, history} with the tags each slot should serve."
            exit 1
          fi
          pre_ptr="$(jq -r '."pre-release" // empty' <<<"$slots_raw")"
          stable_ptr="$(jq -r '.stable // empty' <<<"$slots_raw")"
          echo "slots.json: pre-release=${pre_ptr:-<null>} stable=${stable_ptr:-<null>}"

          tag_pat='^[0-9]{6}-[0-9]{4}$'
          target_repo="${GITHUB_REPOSITORY_OWNER}/armbian-build"

          # Tags must match YYMMDD-HHMM (the build stamp) — a hand-made
          # release with a free-form tag would win the lexicographic sort
          # otherwise and then fail the mirror guard below anyway.
          if [ -n "${TAG_IN:-}" ]; then
            # Explicit tag: the operator decides WHICH build ships (e.g.
            # the one verified on hardware while a newer build landed).
            # The mirror must agree — this is an intent check, not just
            # consistency.
            tag="$TAG_IN"
            state="$(gh release view "$tag" --repo "$target_repo" \
                      --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
            [ "$state" = "false true" ] \
              || { echo "::error::$tag is not a published pre-release (state: $state)"; exit 1; }
            [ "$pre_ptr" = "$tag" ] \
              || { echo "::error::slots.json pre-release is '${pre_ptr:-<null>}' but '$tag' was requested — the mirror names a different build; refusing"; exit 1; }
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
            echo "promoting $tag (explicit input) in $target_repo"
            exit 0
          fi

          jq_pick="[.[] | select(.isPrerelease and (.tagName | test(\"$tag_pat\")))] | sort_by(.tagName) | last | .tagName // empty"
          tag="$(gh release list --repo "$target_repo" \
                --json tagName,isPrerelease --jq "$jq_pick")"

          # ── no pre-release: heal, recover-page, or real failure.
          if [ -z "$tag" ]; then
            jq_stable="[.[] | select(.isPrerelease == false and (.tagName | test(\"$tag_pat\")))] | sort_by(.tagName) | last | .tagName // empty"
            stable="$(gh release list --repo "$target_repo" \
                --json tagName,isPrerelease --jq "$jq_stable")"
            [ -n "$stable" ] \
              || { echo "::error::no pre-release and no stable release found in $target_repo"; exit 1; }

            if [ "$pre_ptr" = "$stable" ] && [ "$stable_ptr" != "$stable" ]; then
              # The publish already flipped the release stable, but the
              # pointer still names it as pre-release — a previous run
              # died between publish and flip. Validate will re-check the
              # tree+manifest before anything is written.
              echo "::notice::$stable is published Stable and slots.json still lists it as pre-release — completing the interrupted flip (mode=heal)"
              echo "mode=heal" >> "$GITHUB_OUTPUT"
              echo "tag=$stable" >> "$GITHUB_OUTPUT"
              echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$pre_ptr" ] && [ "$stable_ptr" = "$stable" ]; then
              echo "::notice::no pre-release; slots.json already names $stable as stable — recovering the pages deploy (mode=recover-page)"
              echo "mode=recover-page" >> "$GITHUB_OUTPUT"
              echo "tag=$stable" >> "$GITHUB_OUTPUT"
              echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::no pre-release; slots.json (pre-release='${pre_ptr:-<null>}', stable='${stable_ptr:-<null>}') disagrees with the newest stable '$stable' — inconsistent state, refusing to guess"
            exit 1
          fi

          state="$(gh release view "$tag" --repo "$target_repo" \
                    --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          echo "release state (isDraft prerelease): $state"
          [ "$state" = "false true" ] \
            || { echo "::error::$tag is not a published pre-release (draft or already stable)"; exit 1; }
          [ "$pre_ptr" = "$tag" ] \
            || { echo "::error::newest pre-release is '$tag' but slots.json pre-release is '${pre_ptr:-<null>}' — a pre-migration (old-code) build published a release the manifest index doesn't know. Delete that release, or promote an explicit tag via the 'tag' input."; exit 1; }
          echo "mode=promote" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
          echo "promoting $tag in $target_repo"

      - name: Validate the tag's tree
        # Runs for promote AND heal (heal re-checks before writing).
        # Skipped in recover-page mode: nothing is about to be written.
        # Shape + signed manifest, all BEFORE anything is published or
        # flipped:
        #   a) every <board>/<sec>/<kind>/ is complete: >=1 *.img.xz, each with
        #      a .sha256 sibling, non-empty ota/, no stray files
        #   b) trees/<tag>/manifest.json exists, is signed with the tag
        #      (the "tag" field is the build's signature — the old root
        #      tag file was folded into it), and covers the walked files
        #      BOTH ways — a build that died between upload and manifest
        #      never flips visible, but a stale or hand-edited manifest
        #      would render a broken slot
        if: steps.rel.outputs.mode == 'promote' || steps.rel.outputs.mode == 'heal'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          from collections import defaultdict

          tag_expected = os.environ["TAG"].strip()
          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"

          def rcat(path):
              r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::rclone cat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def lsjson_files(path):
              r = subprocess.run(["rclone", "lsjson", "-R", "--files-only", path],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::lsjson failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return [it["Path"] for it in json.loads(r.stdout or "[]")]

          errors = []

          # a) shape of the tag's tree. ONE walk; paths are
          # "<board>/<sec>/<kind>/[ota/]<file>" with sec = plain|secure
          # and kind = recovery|ab|loaders. The root-level identity file
          # is the manifest itself — anything else at tree root is a
          # stray, and every board dir must hold plain/ at minimum.
          files = lsjson_files(f"{IBASE}/trees/{tag_expected}")
          KINDS = {"recovery", "ab", "loaders"}
          by_kind, boards = defaultdict(list), set()
          for p in files:
              if p == "manifest.json":
                  continue
              parts = p.split("/")
              if len(parts) < 2:
                  errors.append(f"stray file at trees/{tag_expected}/ root: {p}")
                  continue
              board, sec = parts[0], parts[1]
              if sec not in ("plain", "secure"):
                  errors.append(f"{board}: '{sec}' is not a security dir (expected plain|secure): {p}")
                  continue
              boards.add(board)
              if len(parts) < 4:
                  errors.append(f"stray file at trees/{tag_expected}/{board}/{sec}/ root: {p}")
                  continue
              if parts[2] not in KINDS:
                  errors.append(f"{board}/{sec}: unknown kind '{parts[2]}': {p}")
                  continue
              by_kind[(board, sec, parts[2])].append("/".join(parts[3:]))

          if not any(k[2] in ("recovery", "ab") for k in by_kind):
              errors.append(f"trees/{tag_expected}/ holds no image content at all")

          for (board, sec, kind), fs in sorted(by_kind.items()):
              if kind == "loaders":
                  if not fs:
                      errors.append(f"{board}/{sec}/loaders/ is empty")
                  print(f"{board}/{sec}/loaders: {len(fs)} files")
                  continue
              xz = sorted(n for n in fs if n.endswith(".img.xz"))
              if not xz:
                  errors.append(f"{board}: trees/{tag_expected}/{board}/{sec}/{kind}/ has no *.img.xz")
              for x in xz:
                  if x + ".sha256" not in fs:
                      errors.append(f"{board}: trees/{tag_expected}/{board}/{sec}/{kind}/{x} has no .sha256 sibling")
              ota = [n for n in fs if n.startswith("ota/")]
              if not ota:
                  errors.append(f"{board}: trees/{tag_expected}/{board}/{sec}/{kind}/ota/ is empty or missing")
              print(f"{board}/{sec}/{kind}: {len(fs)} files, {len(xz)} image(s), {len(ota)} ota file(s)")

          # b) signed manifest, coverage both directions against the ONE
          # files map.
          try:
              m = json.loads(rcat(f"{IBASE}/trees/{tag_expected}/manifest.json"))
          except json.JSONDecodeError as e:
              errors.append(f"trees/{tag_expected}/manifest.json is not valid JSON ({e})")
              m = None
          if m is not None:
              if m.get("tag") != tag_expected:
                  errors.append(f"trees/{tag_expected}/manifest.json is signed {m.get('tag')!r} — wrong or unsigned tree")
              mf = m.get("files") or {}
              walked = {p for p in files if p != "manifest.json"}
              for p in sorted(walked - set(mf)):
                  errors.append(f"manifest missing entry for {p}")
              for k in sorted(set(mf) - walked):
                  errors.append(f"manifest entry {k} not on the mirror")
              if any(not u for u in mf.values()):
                  errors.append("manifest holds an empty URL")
              print(f"manifest: {len(mf)} links")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"tree OK: tag {tag_expected}, {len(boards)} boards, "
                f"{len(by_kind)} board/sec/kind dirs, {len(files)} files")
          PY

      - name: Publish + flip slots.json
        # The rotation is ONE pointer write: stable ⟵ TAG, history ⟵
        # [old stable] + old history capped at HISTORY_DEPTH,
        # pre-release ⟶ null. Trees never move, so there is no
        # half-rotated mirror state — the failure modes are "release
        # published but pointer not flipped" (heal on re-run) and
        # "pointer write failed" (state unchanged, re-run heals).
        if: steps.rel.outputs.mode == 'promote' || steps.rel.outputs.mode == 'heal'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          TARGET_REPO: ${{ steps.rel.outputs.target_repo }}
          MODE: ${{ steps.rel.outputs.mode }}
          # Retention: how many older stables stay downloadable. Storage
          # grows ~linearly with this (each tree is a full matrix).
          HISTORY_DEPTH: "1"
        run: |
          set -euo pipefail
          if [ "$MODE" = "promote" ]; then
            # Step 1: publish the release (flip prerelease → stable).
            gh release edit "$TAG" --repo "$TARGET_REPO" --prerelease=false
            # The note REPLACES the draft's build/run pointer — restate the
            # download entry point instead of rotation internals. The page
            # always lives on the build-source repo's Pages (armbian-build).
            # printf-built: a literal multi-line string would need deeper
            # indentation than the YAML block scalar, and the extra spaces
            # would render as a markdown code block.
            page_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/armbian-build/images/"
            notes="$(printf 'Promoted to Stable — on-device verification passed.\n\nDownloads: %s\nBinaries live in the OneDrive mirror (tag-addressed trees, indexed by slots.json); this release carries no assets.\n\nslots.json flipped: previous ⟵ stable, pre-release ⟶ null.' "$page_url")"
            gh release edit "$TAG" --repo "$TARGET_REPO" --notes "$notes"
          else
            echo "heal mode — release $TAG is already published; flipping the pointer only"
          fi

          # Step 2: flip the pointer. Read-verify-write: abort if the
          # file changed since resolve (only a human web-UI edit could —
          # CI writers are serialized by the images-mirror group).
          python3 - "$TAG" <<'PY'
          import json, os, subprocess, sys

          tag = sys.argv[1]
          depth = max(1, int(os.environ.get("HISTORY_DEPTH", "1")))
          path = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images/slots.json"

          def read():
              r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::cannot read slots.json: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return json.loads(r.stdout)

          def history_of(s):
              # newest-first older stables; tolerate the legacy scalar
              # "previous" key from a pre-history-array slots.json
              h = s.get("history")
              if isinstance(h, list):
                  return [t for t in h if t]
              return [s["previous"]] if s.get("previous") else []

          old = read()
          prior = old.get("stable")
          # prepend the demoted stable, dedupe, cap at depth
          new_hist = ([prior] if prior else []) + [t for t in history_of(old) if t != prior]
          new = dict(old)
          new["stable"], new["history"], new["pre-release"] = tag, new_hist[:depth], None
          new.pop("previous", None)    # legacy key retired

          check = read()
          if check != old:
              print("::error::slots.json changed since resolve — a concurrent writer (human edit?) is active; aborting before the flip", file=sys.stderr)
              sys.exit(1)
          w = subprocess.run(["rclone", "rcat", path],
                             input=json.dumps(new, indent=1, sort_keys=True) + "\n",
                             capture_output=True, text=True)
          if w.returncode != 0:
              print(f"::error::flip write failed ({w.stderr.strip()}) — mirror state unchanged; a re-run will heal", file=sys.stderr)
              sys.exit(1)
          print(f"slots.json flipped: stable={tag} history={new['history']} pre-release=null")
          PY

      - name: GC unreferenced trees + legacy leftovers
        # After the flip only stable/history (+pre-release when set) are
        # referenced; everything else is superseded. The manifest AND the
        # loaders subtree live inside trees/<tag>/, so one purge drops
        # payload, index and loaders together — no half-deleted states
        # (the pre-merge second root had exactly that cross-root window).
        # Also sweeps legacy leftovers: slot dirs (pre-release/ etc.) an
        # old-code build wrote back, and the standalone armbian/loaders/
        # root from the two-root era — the pointer file never names
        # them, so they render nowhere.
        if: steps.rel.outputs.mode == 'promote' || steps.rel.outputs.mode == 'heal'
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, subprocess, sys

          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"
          ABASE = "seeed-storage:armbian"
          LEGACY = {"pre-release", "stable", "previous"}

          def rcat(path):
              r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::rclone cat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def lsdirs(path):
              args = ["rclone", "lsjson", "--dirs-only", path]
              r = subprocess.run(args, capture_output=True, text=True)
              if r.returncode != 0:
                  if "not found" in r.stderr.lower():
                      return []    # trees/ absent — nothing to sweep
                  print(f"::error::lsjson failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return [it["Path"] for it in json.loads(r.stdout or "[]")]

          slots = json.loads(rcat(f"{IBASE}/slots.json"))
          # referenced = primary slots + the history array (tolerate the
          # legacy scalar "previous")
          hist = slots.get("history")
          if not isinstance(hist, list):
              hist = [slots["previous"]] if slots.get("previous") else []
          referenced = {t for t in (slots.get("stable"), slots.get("pre-release"),
                                    *hist) if t}
          print(f"referenced tags: {sorted(referenced) or 'none'}")

          for d in lsdirs(IBASE):
              if d in LEGACY:
                  print(f"::notice::purging legacy slot dir images/{d}/ (old-code build residue)")
                  subprocess.run(["rclone", "purge", f"{IBASE}/{d}"], check=True)
          # Pre-namespace global roots a straggler old-code build may
          # recreate — this pipeline owns armbian/<owner>/ only. Owner
          # namespace dirs never match these names.
          for legacy in ("loaders", "images"):
              if legacy in lsdirs(ABASE):
                  print(f"::notice::purging pre-namespace global armbian/{legacy}/ root")
                  subprocess.run(["rclone", "purge", f"{ABASE}/{legacy}"], check=True)
          for t in lsdirs(f"{IBASE}/trees"):
              if t not in referenced:
                  print(f"::notice::purging unreferenced tree images/trees/{t}/")
                  subprocess.run(["rclone", "purge", f"{IBASE}/trees/{t}"], check=True)
          print("GC done")
          PY

      - name: Clean up superseded pre-releases
        # Older pre-releases carry no assets at all (the binaries live in
        # the tag-addressed trees; the manifest is the link source)
        # — pure noise once superseded. Only asset-less releases are
        # deleted, so a GitHub-assets-mode (fork) release with real
        # binaries is never touched. Drafts are left alone — they may
        # belong to in-flight builds. Skipped in recover-page mode:
        # nothing was promoted, so nothing was superseded. (In heal mode
        # there are no pre-releases left by construction — harmless.)
        if: steps.rel.outputs.mode != 'recover-page'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TARGET_REPO: ${{ steps.rel.outputs.target_repo }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          stale="$(gh release list --repo "$TARGET_REPO" --limit 100 \
            --json tagName,isPrerelease,isDraft \
            --jq ".[] | select(.isPrerelease and .isDraft == false and .tagName != \"$TAG\") | .tagName")"
          [ -n "$stale" ] || { echo "no superseded pre-releases"; exit 0; }
          while read -r t; do
            kind="$(gh release view "$t" --repo "$TARGET_REPO" --json assets \
              --jq 'if ([.assets[].name] == []) then "asset-less" else "has-binaries" end')"
            if [ "$kind" = "asset-less" ]; then
              echo "deleting superseded pre-release: $t"
              gh release delete "$t" --repo "$TARGET_REPO" --yes --cleanup-tag \
                || echo "::warning::failed to delete $t"
            else
              echo "keeping $t (assets are not asset-less)"
            fi
          done <<<"$stale"

  # Static download page push (template sync).
  pages:
    name: Deploy the images page (build-source repo's Pages)
    needs: promote
    runs-on: ubuntu-latest
    # The gh-pages push authenticates with PAGES_TARGET_TOKEN (a PAT);
    # GITHUB_TOKEN only reads the release list.
    permissions:
      contents: read
    # The manifest read (≤4 rclone cats) replaced the share-link walk.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy images page
        uses: ./.github/actions/deploy-pages
        with:
          tag: ${{ needs.promote.outputs.tag }}
          # The page always lives on the build-source repo (armbian-build),
          # pushed to its gh-pages via the API (needs PAGES_TARGET_TOKEN).
          repo: ${{ needs.promote.outputs.target_repo }}
          release_repo: ${{ needs.promote.outputs.target_repo }}
          has_rclone: ${{ needs.promote.outputs.has_rclone }}
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          pages_token: ${{ secrets.PAGES_TARGET_TOKEN }}
          gh_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
