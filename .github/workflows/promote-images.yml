name: "Images - Release"

# slots.json is the desired mirror state; this workflow reconciles it:
#   1. a pre-release candidate must have a complete tree/manifest before
#      stable -> history, candidate -> stable, pre-release -> null;
#   2. a confirmed-missing candidate tree clears the dangling pointer and
#      its owned asset-less pre-release Release (transport errors abort);
#   3. no candidate means retain slots.stable, never infer one from the
#      newest GitHub Release;
#   4. history is newest-first and capped at HISTORY_DEPTH (0 allowed);
#   5. expired mirror trees are purged, but their stable GitHub Releases
#      and immutable tags are retained and marked "retention exceeded";
#   6. GitHub's Latest marker follows stable, but the tag stays immutable;
#   7. validate all referenced trees, reconcile Releases, then update Pages.
#
# OneDrive-only: without RCLONE_CONFIG there is nothing to reconcile.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional candidate tag; must match slots.json pre-release"
        required: false
        type: string

concurrency:
  group: images-mirror
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reconcile.outputs.tag }}
      target_repo: ${{ steps.rel.outputs.target_repo }}
      has_rclone: ${{ steps.probe.outputs.has_rclone }}
      mode: ${{ steps.reconcile.outputs.mode }}
    steps:
      - name: Probe secrets
        id: probe
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG" ]; then
            echo "has_rclone=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rclone=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone (seeed-storage OneDrive remote)
        # Reads the rclone config from the repo's own setup-onedrive action
        # inputs — NOT from secrets.RCLONE_CONFIG. secrets.* is not allowed
        # in step-level if:, but action inputs are evaluated before if: and
        # pass secrets through fine; rclone_conf then reads the file the
        # action wrote. Keeps rclone usable inside Resolve for recovery.
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Resolve the tag and guard
        id: rel
        env:
          # The target repo (<owner>/armbian-build) is always cross-repo from
          # here: needs RELEASE_GH_TOKEN (PAT with contents:write).
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG" ]; then
            echo "::error::RCLONE_CONFIG is not set — promotion requires the OneDrive mirror. GitHub-assets-mode (fork) releases are promoted by hand in the UI."
            exit 1
          fi
          # RCLONE_CONFIG env can't hold the secret (secrets.* is not allowed
          # in the step-level if: above); the setup-onedrive action already
          # wrote it to disk, so point rclone at that file instead.
          export RCLONE_CONFIG="$HOME/.config/rclone/rclone.conf"

          # slots.json is both the mirror state and the migration marker:
          # unreadable means the mirror is down or still on the legacy
          # slot layout — either way there is nothing to promote.
          # The mirror is namespaced per pipeline owner (fork and
          # upstream each own armbian/<owner>/images).
          if ! slots_raw="$(rclone cat "seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}/images/slots.json" --contimeout 15s)"; then
            echo "::error::slots.json unreadable — OneDrive unreachable, or the mirror's pointer file is gone. Restore it by hand: list trees/, then write {stable, pre-release, history} with the tags each slot should serve."
            exit 1
          fi
          pre_ptr="$(jq -r '."pre-release" // empty' <<<"$slots_raw")"
          stable_ptr="$(jq -r '.stable // empty' <<<"$slots_raw")"
          echo "slots.json: pre-release=${pre_ptr:-<null>} stable=${stable_ptr:-<null>}"

          if [ -n "$pre_ptr" ]; then
            echo "::notice::candidate $pre_ptr found in slots.json; validate its tree before reconciliation"
            echo "tag=$pre_ptr" >> "$GITHUB_OUTPUT"
          fi
          target_repo="${GITHUB_REPOSITORY_OWNER}/armbian-build"
          if [ -n "${TAG_IN:-}" ]; then
            # Explicit tag narrows the slots.json candidate; it never
            # chooses a different Release behind the mirror's back.
            [ "$pre_ptr" = "$TAG_IN" ] \
              || { echo "::error::slots.json pre-release is '${pre_ptr:-<null>}' but '$TAG_IN' was requested; refusing"; exit 1; }
          fi
          tag="$pre_ptr"
          if [ -n "$tag" ]; then
            # slots.json is authoritative. Reconcile even when the Release
            # is already stable (a previous run may have died after its
            # publish step but before the pointer flip).
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
            echo "candidate from slots.json: $tag"
            exit 0
          fi

          # No candidate: retain the current stable and refresh/prune
          # according to HISTORY_DEPTH. Never guess a new stable from the
          # most recent GitHub Release.
          [ -n "$stable_ptr" ] \
            || { echo "::error::slots.json has neither pre-release nor stable; nothing to reconcile"; exit 1; }
          echo "::notice::no pre-release; retaining slots.json stable $stable_ptr and reconciling history/pages"
          echo "mode=reconcile" >> "$GITHUB_OUTPUT"
          echo "tag=$stable_ptr" >> "$GITHUB_OUTPUT"
          echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"

      - name: Reconcile slots.json with mirror and Releases
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TARGET_REPO: ${{ steps.rel.outputs.target_repo }}
          TAG: ${{ steps.rel.outputs.tag }}
          MODE: ${{ steps.rel.outputs.mode }}
          HISTORY_DEPTH: "1"
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import json, os, re, subprocess, sys

          tag = sys.argv[1]
          mode = os.environ["MODE"]
          repo = os.environ["TARGET_REPO"]
          depth = int(os.environ.get("HISTORY_DEPTH", "1"))
          if depth < 0:
              raise SystemExit("HISTORY_DEPTH must be >= 0")
          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"

          def remote(*args, input=None, missing=False):
              r = subprocess.run(["rclone", *args], input=input,
                                 capture_output=True, text=True)
              if r.returncode:
                  if missing and "not found" in r.stderr.lower():
                      return None
                  print(f"::error::rclone {' '.join(args)}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def gh(*args, input=None):
              r = subprocess.run(["gh", *args, "--repo", repo], input=input,
                                 capture_output=True, text=True)
              if r.returncode:
                  print(f"::error::gh {' '.join(args)}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def write_slots(new):
              current = remote("cat", f"{IBASE}/slots.json", "--contimeout", "15s")
              if json.dumps(json.loads(current), sort_keys=True) != old_snapshot:
                  raise SystemExit("slots.json changed during reconcile; refusing to overwrite a concurrent edit")
              remote("rcat", f"{IBASE}/slots.json",
                     input=json.dumps(new, indent=1, sort_keys=True) + "\n")

          old = json.loads(remote("cat", f"{IBASE}/slots.json", "--contimeout", "15s"))
          hist = old.get("history")
          if not isinstance(hist, list):
              hist = [old["previous"]] if old.get("previous") else []
          old["history"] = hist
          pre = old.get("pre-release")
          stable = old.get("stable")
          changed = False
          mode_out = mode
          old_snapshot = json.dumps(old, sort_keys=True)

          if pre and mode == "promote":
              if pre != tag:
                  raise SystemExit(f"candidate changed during reconcile: {pre} != {tag}")
              # Confirm tree existence without treating a transport error
              # as a missing tree. Manifest validation below is the full
              # gate; absence is a repairable dangling candidate pointer.
              raw = remote("cat", f"{IBASE}/trees/{pre}/manifest.json",
                           "--contimeout", "15s", missing=True)
              if raw is None:
                  print(f"::warning::candidate tree {pre} is absent; clearing only the dangling pre-release pointer", file=sys.stderr)
                  old["pre-release"] = None
                  write_slots(old)
                  changed = True
                  mode_out = "reconcile"
              else:
                  manifest = json.loads(raw)
                  if manifest.get("tag") != pre or not manifest.get("files"):
                      raise SystemExit(f"candidate {pre} has an invalid/incomplete manifest; refusing promotion")
                  state = gh("release", "view", pre, "--json", "isDraft,isPrerelease",
                             "--jq", '"\\(.isDraft) \\(.isPrerelease)"').strip()
                  if state == "true true":
                      gh("release", "edit", pre, "--draft=false", "--prerelease")
                  elif state not in ("false true", "false false"):
                      raise SystemExit(f"candidate Release {pre} is missing or has invalid state {state}")
                  # Stable must always exist before rotating it into
                  # history. A first-ever candidate can become stable
                  # directly; an existing stable is validated by deploy.
                  new_hist = ([stable] if stable else []) + [t for t in hist if t != stable]
                  new_hist = list(dict.fromkeys(t for t in new_hist if t and t != pre))
                  new = dict(old)
                  new["stable"], new["history"], new["pre-release"] = pre, new_hist[:depth], None
                  new.pop("previous", None)
                  if new != old:
                      write_slots(new)
                      old = new
                      changed = True
                  gh("release", "edit", pre, "--prerelease=false", "--latest")
                  print(f"promoted {pre} to stable; history={new['history']}")
          elif pre:
              raise SystemExit(f"internal error: unexpected candidate mode {mode}")

          # Retention affects mirror payload only. GitHub Releases are
          # permanent version history, including stable versions whose
          # OneDrive tree has exceeded HISTORY_DEPTH.
          hist = old.get("history") if isinstance(old.get("history"), list) else []
          refs = [old.get("stable"), old.get("pre-release"), *hist]
          refs = [t for t in refs if t]
          ordered = list(dict.fromkeys(refs))
          if not ordered:
              print("::warning::no stable or candidate remains after repair; keeping pre-release null and refreshing the empty page")
              print("tag=", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              print("mode=reconcile", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              print("changed=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              sys.exit(0)
          new_hist = [t for t in ordered if t not in (old.get("stable"), old.get("pre-release"))][:depth]
          if new_hist != hist or "previous" in old:
              old["history"] = new_hist
              old.pop("previous", None)
              write_slots(old)
              changed = True

          print(f"tag={old['stable']}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          print(f"mode={mode_out}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          print(f"changed={'true' if changed else 'false'}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          print(f"reconciled slots: {old}")
          PY
      - name: Validate every referenced tree
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          from collections import defaultdict

          tag_expected = os.environ["TAG"].strip()
          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"

          def rcat(path):
              r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::rclone cat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def lsjson_files(path):
              r = subprocess.run(["rclone", "lsjson", "-R", "--files-only", path],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::lsjson failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return [it["Path"] for it in json.loads(r.stdout or "[]")]

          slots = json.loads(subprocess.run(
              ["rclone", "cat", f"{IBASE}/slots.json", "--contimeout", "15s"],
              check=True, capture_output=True, text=True).stdout)
          referenced = [slots.get("stable"), slots.get("pre-release"), *(slots.get("history") or [])]
          referenced = [t for t in referenced if t]
          errors = []

          # a) shape of the tag's tree. ONE walk; paths are
          # "<board>/<sec>/<kind>/[ota/]<file>" with sec = plain|secure
          # and kind = recovery|ab|loaders. The root-level identity file
          # is the manifest itself — anything else at tree root is a
          # stray, and every board dir must hold plain/ at minimum.
          for tag_expected in referenced:
            files = lsjson_files(f"{IBASE}/trees/{tag_expected}")
            KINDS = {"recovery", "ab", "loaders"}
            by_kind, boards = defaultdict(list), set()
            for p in files:
                if p == "manifest.json":
                    continue
                parts = p.split("/")
                if len(parts) < 2:
                    errors.append(f"stray file at trees/{tag_expected}/ root: {p}")
                    continue
                board, sec = parts[0], parts[1]
                if sec not in ("plain", "secure"):
                    errors.append(f"{board}: '{sec}' is not a security dir (expected plain|secure): {p}")
                    continue
                boards.add(board)
                if len(parts) < 4:
                    errors.append(f"stray file at trees/{tag_expected}/{board}/{sec}/ root: {p}")
                    continue
                if parts[2] not in KINDS:
                    errors.append(f"{board}/{sec}: unknown kind '{parts[2]}': {p}")
                    continue
                by_kind[(board, sec, parts[2])].append("/".join(parts[3:]))

            if not any(k[2] in ("recovery", "ab") for k in by_kind):
                errors.append(f"trees/{tag_expected}/ holds no image content at all")

            for (board, sec, kind), fs in sorted(by_kind.items()):
                if kind == "loaders":
                    if not fs:
                        errors.append(f"{board}/{sec}/loaders/ is empty")
                    print(f"{board}/{sec}/loaders: {len(fs)} files")
                    continue
                xz = sorted(n for n in fs if n.endswith(".img.xz"))
                if not xz:
                    errors.append(f"{board}: trees/{tag_expected}/{board}/{sec}/{kind}/ has no *.img.xz")
                for x in xz:
                    if x + ".sha256" not in fs:
                        errors.append(f"{board}: trees/{tag_expected}/{board}/{sec}/{kind}/{x} has no .sha256 sibling")
                ota = [n for n in fs if n.startswith("ota/")]
                if not ota:
                    errors.append(f"{board}: trees/{tag_expected}/{board}/{sec}/{kind}/ota/ is empty or missing")
                print(f"{board}/{sec}/{kind}: {len(fs)} files, {len(xz)} image(s), {len(ota)} ota file(s)")

            # b) signed manifest, coverage both directions against the ONE
            # files map.
            try:
                m = json.loads(rcat(f"{IBASE}/trees/{tag_expected}/manifest.json"))
            except json.JSONDecodeError as e:
                errors.append(f"trees/{tag_expected}/manifest.json is not valid JSON ({e})")
                m = None
            if m is not None:
                if m.get("tag") != tag_expected:
                    errors.append(f"trees/{tag_expected}/manifest.json is signed {m.get('tag')!r} — wrong or unsigned tree")
                mf = m.get("files") or {}
                walked = {p for p in files if p != "manifest.json"}
                for p in sorted(walked - set(mf)):
                    errors.append(f"manifest missing entry for {p}")
                for k in sorted(set(mf) - walked):
                    errors.append(f"manifest entry {k} not on the mirror")
                if any(not u for u in mf.values()):
                    errors.append("manifest holds an empty URL")
                print(f"manifest: {len(mf)} links")

            if errors:
                for e in errors:
                    print(f"::error::{e}")
                sys.exit(1)
            print(f"tree OK: tag {tag_expected}, {len(boards)} boards, "
                  f"{len(by_kind)} board/sec/kind dirs, {len(files)} files")
          PY

      - name: GC unreferenced trees + legacy leftovers
        # Mirror retention is bounded, but GitHub Releases are permanent
        # historical records. Never delete a Stable Release when its tree
        # exceeds HISTORY_DEPTH. Only this owner's namespace is swept.
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys

          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"
          LEGACY = {"pre-release", "stable", "previous"}

          def rcat(path):
              r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                 capture_output=True, text=True)
              if r.returncode:
                  print(f"::error::rclone cat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def lsdirs(path):
              r = subprocess.run(["rclone", "lsjson", "--dirs-only", path],
                                 capture_output=True, text=True)
              if r.returncode:
                  if "not found" in r.stderr.lower():
                      return []
                  print(f"::error::lsjson failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return [it["Path"] for it in json.loads(r.stdout or "[]")]

          slots = json.loads(rcat(f"{IBASE}/slots.json"))
          hist = slots.get("history")
          if not isinstance(hist, list):
              hist = [slots["previous"]] if slots.get("previous") else []
          referenced = {t for t in (slots.get("stable"), slots.get("pre-release"),
                                    *hist) if t}
          print(f"referenced tags: {sorted(referenced) or 'none'}")
          for d in lsdirs(IBASE):
              if d in LEGACY:
                  subprocess.run(["rclone", "purge", f"{IBASE}/{d}"], check=True)
          for t in lsdirs(f"{IBASE}/trees"):
              if t not in referenced:
                  print(f"::notice::purging expired mirror tree {t}; retaining its GitHub Release")
                  subprocess.run(["rclone", "purge", f"{IBASE}/trees/{t}"], check=True)
          print("GC done — stable/history Releases retained")
          PY

      - name: Reconcile Releases and expire mirror notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TARGET_REPO: ${{ steps.rel.outputs.target_repo }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess, sys

          repo = os.environ["TARGET_REPO"]
          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"
          slots = json.loads(subprocess.run(
              ["rclone", "cat", f"{IBASE}/slots.json", "--contimeout", "15s"],
              check=True, capture_output=True, text=True).stdout)
          hist = slots.get("history") if isinstance(slots.get("history"), list) else []
          referenced = {slots.get("stable"), slots.get("pre-release"), *hist} - {None}
          expired = []

          def gh(*args):
              r = subprocess.run(["gh", *args, "--repo", repo],
                                 capture_output=True, text=True)
              if r.returncode:
                  print(f"::error::gh {' '.join(args)}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          # Promote only slots.json's current stable to the GitHub Latest
          # marker; the immutable version tag never becomes "latest".
          if slots.get("stable"):
              gh("release", "edit", slots["stable"], "--prerelease=false", "--latest")

          # A candidate with no tree is repairable; a stable/history tree
          # was already hard-validated above. Delete only owned asset-less
          # pre-releases that are no longer the candidate. Never delete a
          # stable Release just because its mirror payload expired.
          owned = re.compile(rf"{re.escape(os.environ['GITHUB_REPOSITORY'])}/actions/runs/\d+\b")
          for rel in json.loads(gh("release", "list", "--limit", "100", "--json",
                                   "tagName,isDraft,isPrerelease,assets,body")):
              tag = rel["tagName"]
              if tag not in referenced and not rel["isPrerelease"]:
                  expired.append(tag)
              if tag == slots.get("pre-release") or not rel["isPrerelease"]:
                  continue
              if rel["isDraft"] or rel["assets"] or not owned.search(rel.get("body") or ""):
                  continue
              r = subprocess.run(["rclone", "cat", f"{IBASE}/trees/{tag}/manifest.json",
                                  "--contimeout", "15s"], capture_output=True, text=True)
              if r.returncode and "not found" in r.stderr.lower():
                  print(f"::warning::deleting dangling candidate Release {tag}")
                  gh("release", "delete", tag, "--yes", "--cleanup-tag")

          # Preserve expired stable Releases but correct their download
          # promise. Do not rewrite notes while their tree is downloadable.
          for tag in expired:
              body = gh("release", "view", tag, "--json", "body", "--jq", ".body")
              if "Mirror retention exceeded" in body:
                  continue
              note = ("Mirror retention exceeded: the OneDrive image tree for this "
                      "release has been removed to save space. This GitHub Release "
                      "and its immutable version tag are retained as historical metadata; "
                      "no mirror download is available for this tag.")
              gh("release", "edit", tag, "--notes", note)
              print(f"marked expired mirror retention on retained Release {tag}")
          PY

  # Static download page push (template sync).
  pages:
    name: Deploy the images page (build-source repo's Pages)
    needs: promote
    runs-on: ubuntu-latest
    # The gh-pages push authenticates with PAGES_TARGET_TOKEN (a PAT);
    # GITHUB_TOKEN only reads the release list.
    permissions:
      contents: read
    # The manifest read (≤4 rclone cats) replaced the share-link walk.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy images page
        uses: ./.github/actions/deploy-pages
        with:
          tag: ${{ needs.promote.outputs.tag }}
          # The page always lives on the build-source repo (armbian-build),
          # pushed to its gh-pages via the API (needs PAGES_TARGET_TOKEN).
          repo: ${{ needs.promote.outputs.target_repo }}
          release_repo: ${{ needs.promote.outputs.target_repo }}
          has_rclone: ${{ needs.promote.outputs.has_rclone }}
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          pages_token: ${{ secrets.PAGES_TARGET_TOKEN }}
          gh_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
