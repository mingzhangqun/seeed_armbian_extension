name: "APT - Build & Publish"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Package sources branch/tag'
        required: false
        default: 'deb_source'
      armbian_build_ref:
        description: 'Seeed-Studio/armbian-build branch/tag'
        required: false
        default: 'main'
      build_rk3576:
        description: 'recomputer-rk3576-devkit'
        required: false
        type: boolean
        default: true
      build_rk3576_module:
        description: 'recomputer-rk3576-module-devkit'
        required: false
        type: boolean
        default: true
      build_rk3576_industrial:
        description: 'recomputer-rk3576-industrial'
        required: false
        type: boolean
        default: true
      build_rk3588:
        description: 'recomputer-rk3588-devkit'
        required: false
        type: boolean
        default: true
      build_kernel:
        description: 'Build kernel debs (hotfix; U-Boot always builds) — default off, kernels come from official Armbian apt'
        required: false
        type: boolean
        default: false

# Keep an older APT deployment from replacing a newer project Pages site.
concurrency:
  group: apt-pages-${{ github.repository_owner }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────
# Single workflow: userspace debs (ARM) and kernel +
# U-Boot debs (x86 cross-compile) build in parallel,
# then publish merges everything into one APT repo.
# No cross-workflow release cache, no chained trigger.
# ──────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────────
  # Build a JSON matrix of boards from the dispatch
  # input flags (workflow_dispatch is the only trigger,
  # so every input always carries its default).
  # ──────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      armbian_ref: ${{ steps.gen.outputs.armbian_ref }}
    steps:
      - name: Generate matrix
        id: gen
        env:
          # Boolean dispatch inputs render directly as 'true'/'false'.
          # Do NOT write `${{ inputs.X || 'true' }}`: boolean false is falsy,
          # so `false || 'true'` evaluates to 'true' and unchecking a board
          # would still build it.
          INPUT_RK3576: ${{ inputs.build_rk3576 }}
          INPUT_RK3576_MODULE: ${{ inputs.build_rk3576_module }}
          INPUT_RK3576_INDUSTRIAL: ${{ inputs.build_rk3576_industrial }}
          INPUT_RK3588: ${{ inputs.build_rk3588 }}
          INPUT_BUILD_KERNEL: ${{ inputs.build_kernel }}
          INPUT_REF: ${{ inputs.armbian_build_ref || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Matrix entries: one uboot per selected board, one kernel per
          # family when INPUT_BUILD_KERNEL is on. Kernel debs are
          # family-scoped, so each kernel entry builds on the first
          # selected board of its family — sibling boards would rebuild
          # the same package and collide in the publish merge.
          boards=()
          [[ "${INPUT_RK3576}" == 'true' ]] && boards+=('recomputer-rk3576-devkit')
          [[ "${INPUT_RK3576_MODULE}" == 'true' ]] && boards+=('recomputer-rk3576-module-devkit')
          [[ "${INPUT_RK3576_INDUSTRIAL}" == 'true' ]] && boards+=('recomputer-rk3576-industrial')
          [[ "${INPUT_RK3588}" == 'true' ]] && boards+=('recomputer-rk3588-devkit')
          if [ ${#boards[@]} -eq 0 ]; then
            echo "::error::No boards selected (enable at least one build_* input)."
            exit 1
          fi
          family_of() {
            case "$1" in
              recomputer-rk3576-*) echo 'rk3576' ;;
              recomputer-rk3588-*) echo 'rk3588' ;;
              *)                   echo 'unknown' ;;
            esac
          }
          matrix=''
          for b in "${boards[@]}"; do
            fam="$(family_of "$b")"
            matrix+="{\"target\":\"uboot\",\"board\":\"${b}\",\"family\":\"${fam}\"},"
          done
          # Ref validation: chars in [A-Za-z0-9._-/] (branch/tag names)
          if [[ ! "${INPUT_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid armbian_build_ref: '${INPUT_REF}'"
            exit 1
          fi
          # Existence check: warn (don't fail) if ref not found, fall back to main.
          LSREMOTE=$(git ls-remote "https://github.com/Seeed-Studio/armbian-build.git" "${INPUT_REF}" 2>/dev/null || true)
          if [[ -n "${LSREMOTE}" ]]; then
            RESOLVED="${INPUT_REF}"
          else
            RESOLVED="main"
            echo "::warning::Ref '${INPUT_REF}' not found in Seeed-Studio/armbian-build, using 'main'."
          fi
          echo "armbian_ref=${RESOLVED}" >> "$GITHUB_OUTPUT"
          # Prepare fails explicitly if no selected board can host a requested
          # family kernel. Do not bind it to a missing first board and report
          # success with no kernel artifact. Industrial boards require their
          # dedicated ref; main cannot silently satisfy that request.
          seen_families=''
          if [[ "${INPUT_BUILD_KERNEL}" == 'true' ]]; then
            kernel_boards=()
            requested_families=''
            for b in "${boards[@]}"; do
              fam="$(family_of "$b")"
              [[ "${requested_families}" == *"|${fam}|"* ]] || \
                requested_families="${requested_families}|${fam}|"
              [[ "${seen_families}" == *"|${fam}|"* ]] && continue
              if gh api "repos/Seeed-Studio/armbian-build/contents/config/boards/${b}.conf?ref=${RESOLVED}" --silent >/dev/null 2>&1 ||
                 gh api "repos/Seeed-Studio/armbian-build/contents/config/boards/${b}.csc?ref=${RESOLVED}" --silent >/dev/null 2>&1; then
                kernel_boards+=("${b}:${fam}")
                seen_families="${seen_families}|${fam}|"
              else
                echo "::warning::No ${fam} kernel host board ${b} at ${RESOLVED}; trying another selected board."
              fi
            done
            if [ ${#kernel_boards[@]} -eq 0 ]; then
              echo "::error::build_kernel requested, but no selected board can host a kernel at ${RESOLVED}."
              exit 1
            fi
            # Every requested family must be covered: a missing family would
            # publish without that kernel deb and still report success.
            for fam in ${requested_families//|/ }; do
              [[ "${seen_families}" == *"|${fam}|"* ]] || {
                echo "::error::No ${fam} kernel host board at ${RESOLVED}; refusing to publish without that family's kernel."
                exit 1
              }
            done
            # One kernel matrix entry per family, hosted on its first
            # selected board that exists at the resolved ref.
            for entry in "${kernel_boards[@]}"; do
              matrix+="{\"target\":\"kernel\",\"board\":\"${entry%:*}\",\"family\":\"${entry##*:}\"},"
            done
          fi
          matrix="[${matrix%,}]"
          {
            echo "matrix<<EOF"
            echo "${matrix}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Selected boards: ${boards[*]}"
          echo "U-Boot: every selected board; kernel entries: ${INPUT_BUILD_KERNEL} (families: ${seen_families//|/ })"
          echo "armbian-build ref: ${RESOLVED}"

  # ──────────────────────────────────────────────────
  # Build all userspace packages on Debian Bookworm (oldest supported).
  # Binaries are forward-compatible with newer distros (trixie, noble, etc.)
  # ──────────────────────────────────────────────────
  build-userspace:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fcs960k-aic-bluez
            source_dir: FCS960K-aic-bluz
            build_deps: >-
              autoconf automake libtool pkg-config flex bison
              libglib2.0-dev libdbus-1-dev libreadline-dev
              libncurses-dev libffi-dev zlib1g-dev
              libgettextpo-dev libexpat-dev libudev-dev libical-dev
              libjson-c-dev libelf-dev python3-docutils
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: hostapd-morse-tools
            source_dir: morse-halow/hostapd_morse_tools
            build_deps: libnl-3-dev libnl-genl-3-dev libnl-route-3-dev libssl-dev libdbus-1-dev
            build_cmd: make deb

          - name: morsectrl-tools
            source_dir: morse-halow/morsectrl_tools
            build_deps: quilt pkg-config libnl-3-dev libnl-genl-3-dev libnl-route-3-dev gcc-aarch64-linux-gnu
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: wpa-supplicant-morse-tools
            source_dir: morse-halow/wpa_supplicant_morse_tools
            build_deps: libnl-3-dev libnl-genl-3-dev libnl-route-3-dev libssl-dev libdbus-1-dev
            build_cmd: make deb

          - name: maxio-phy-dkms
            source_dir: maxio-phy-dkms
            build_deps: dh-sequence-dkms
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: morse-firmware
            source_dir: morse-halow/morse-firmware
            build_deps: ''
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: morse-fgh100m-dkms
            source_dir: morse-halow/morse-fgh100m-dkms
            build_deps: dh-sequence-dkms
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: morse-halow
            source_dir: morse-halow/morse-halow
            build_deps: ''
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: realtek-r8125-dkms
            source_dir: realtek-r8125-dkms
            build_deps: dh-sequence-dkms
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: wq9201s-wifi-bt-dkms
            source_dir: wq9201s-wifi-bt-dkms
            build_deps: dh-sequence-dkms
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: bluez-btattach
            source_dir: bluez-btattach
            build_deps: debhelper
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: pcie-rkep-dkms
            source_dir: pcie-rkep-dkms
            build_deps: dh-sequence-dkms
            build_cmd: DEB_BUILD_OPTIONS="noddebs" dpkg-buildpackage -us -uc -b

          - name: usbdevice-gadget
            source_dir: rk35xx_usb_gadget
            build_deps: ''
            build_cmd: bash build-usbdevice-deb.sh

          # camera-engine-rkaiq is built by the dedicated build-camera-engine
          # job below (cross toolchain); on its failure the publish job falls
          # back to prebuilt/ on the source branch.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'deb_source' }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential devscripts debhelper \
            dpkg-dev fakeroot ${{ matrix.build_deps }}

      - name: Build ${{ matrix.name }}
        shell: bash
        working-directory: ${{ matrix.source_dir }}
        run: |
          set -euo pipefail
          ${{ matrix.build_cmd }}
          mkdir -p /tmp/debs
          find .. -maxdepth 1 -name '*.deb' ! -name 'Makefile.deb' -exec cp {} /tmp/debs/ \;
          find . -name '*.deb' ! -name 'Makefile.deb' -exec cp {} /tmp/debs/ \;
          echo "Built packages:"
          ls -lh /tmp/debs/*.deb

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.name }}
          path: /tmp/debs/*.deb

  # ──────────────────────────────────────────────────
  # camera-engine-rkaiq cross build (Arm GNU 10.3 toolchain,
  # pinned libdrm bullseye sysroot — see camera_engine_rkaiq/
  # build-deb.sh). Must run on x86_64: the toolchain tarball
  # is x86_64-hosted. continue-on-error keeps the release
  # flowing: on failure publish falls back to the snapshot
  # in prebuilt/ on the source branch (same filenames are
  # no-clobbered by publish's cp -vn).
  # ──────────────────────────────────────────────────
  build-camera-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    container:
      image: debian:bookworm
    steps:
      - name: Checkout (package sources)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'deb_source' }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils m4 gcc g++ xxd vim-common cmake ninja-build dpkg-dev

      - name: Cache Arm GNU 10.3 toolchain + libdrm sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/seeed-rkaiq-toolchain
          key: rkaiq-toolchain-10.3-2021.07-libdrm-2.4.104

      - name: Build rk3576 (ISP v39)
        working-directory: camera_engine_rkaiq
        run: ./build-deb.sh rk3576

      - name: Build rk3588 (ISP v30)
        working-directory: camera_engine_rkaiq
        run: ./build-deb.sh rk3588

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-camera-engine-rkaiq
          path: camera-engine-rkaiq-*_arm64.deb
          if-no-files-found: error

  # ──────────────────────────────────────────────────
  # Board debs (x86 cross-compile) via scripts/build.sh.
  # Matrix target dimension, all entries parallel:
  #   uboot  — per selected board, always (official apt has no U-Boot
  #            for these boards)
  #   kernel — per family, only with build_kernel (hotfix; official
  #            apt hosts the vendor-seeed kernels)
  # Boards missing from armbian_build_ref skip gracefully.
  # Output: armbian-build/output/debs/*.deb
  # ──────────────────────────────────────────────────
  build-kernel-uboot:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        value: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout (for scripts/build.sh and extension)
        uses: actions/checkout@v4

      - name: Checkout armbian-build
        uses: actions/checkout@v4
        with:
          repository: Seeed-Studio/armbian-build
          ref: ${{ needs.prepare.outputs.armbian_ref }}
          path: armbian-build
          fetch-depth: 1

      - name: Stage build.sh and install extension
        run: |
          EXT_DIR="$PWD"
          mkdir -p armbian-build/userpatches/extensions
          # armbian-build's extension search uses `find -type f` (no -L),
          # which doesn't follow symlinks — a symlinked extension reads as
          # 0 files and the framework falls back to fetching
          # Seeed-Studio/seeed_armbian_extension from GitHub (which lacks
          # the maskrom SPL hooks). Copy the repo instead so the local
          # fork version wins.
          rsync -a --exclude='.git' --exclude='.claude' --exclude='.omc' \
            --exclude='.codegraph' --exclude='armbian-build' \
            --exclude='*.w' --exclude='*.m' --exclude='*.bak' \
            "${EXT_DIR}/" armbian-build/userpatches/extensions/seeed_armbian_extension/
          cp scripts/build.sh armbian-build/build.sh
          chmod +x armbian-build/build.sh
          echo "Staged build.sh -> armbian-build/build.sh"
          echo "Copied extension -> armbian-build/userpatches/extensions/seeed_armbian_extension"

      - name: Check board exists in armbian-build ref
        id: board_exists
        env:
          BOARD: ${{ matrix.value.board }}
          TARGET: ${{ matrix.value.target }}
          ARMBIAN_REF: ${{ needs.prepare.outputs.armbian_ref }}
        run: |
          if [ -f "armbian-build/config/boards/${BOARD}.conf" ] || [ -f "armbian-build/config/boards/${BOARD}.csc" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Board ${BOARD} found in armbian-build ${ARMBIAN_REF}"
          elif [[ "$TARGET" == 'kernel' ]]; then
            echo "::error::Selected kernel host board ${BOARD} is missing from ${ARMBIAN_REF}; refusing a publish without the requested kernel."
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Board ${BOARD} is not in armbian-build ${ARMBIAN_REF} yet; skipping this job's U-Boot build."
          fi

      - name: Install build dependencies
        if: steps.board_exists.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            python3 device-tree-compiler swig \
            cpio rsync curl wget git \
            dwarves

      - name: Compile kernel
        if: ${{ matrix.value.target == 'kernel' && steps.board_exists.outputs.exists == 'true' }}
        working-directory: armbian-build
        env:
          BOARD: ${{ matrix.value.board }}
        run: |
          ./build.sh --kernel -b "${BOARD}"

      - name: Compile U-Boot
        if: ${{ matrix.value.target == 'uboot' && steps.board_exists.outputs.exists == 'true' }}
        working-directory: armbian-build
        env:
          BOARD: ${{ matrix.value.board }}
        run: |
          ./build.sh --uboot -b "${BOARD}"

      - name: List built debs
        if: steps.board_exists.outputs.exists == 'true'
        env:
          BOARD: ${{ matrix.value.board }}
        run: |
          echo "=== Built packages for ${BOARD} ==="
          find armbian-build/output/debs -name '*.deb' -exec ls -lh {} \;

      - name: Upload debs
        if: steps.board_exists.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.value.target }}-${{ matrix.value.board }}
          path: armbian-build/output/debs/**/*.deb

  # ──────────────────────────────────────────────────
  # Publish APT repository (aptly + GitHub Pages).
  # Merges userspace + kernel/U-Boot debs (from the two
  # build jobs above) with prebuilt and SDK debs, then
  # regenerates the entire apt repo + an index HTML page.
  # ──────────────────────────────────────────────────
  publish:
    needs: [build-userspace, build-kernel-uboot, build-camera-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4

      - name: Download all debs
        uses: actions/download-artifact@v4
        with:
          path: /tmp/debs
          pattern: debs-*
          merge-multiple: true

      - name: Checkout prebuilt debs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'deb_source' }}
          sparse-checkout: prebuilt
          path: deb-source

      - name: Merge prebuilt debs
        run: |
          if [[ -d deb-source/prebuilt ]]; then
            copied=0
            # Recurse consistently with the count below; an empty directory is
            # a valid source, not an unexpanded cp glob failure.
            while IFS= read -r -d '' deb; do
              if cp -vn "$deb" /tmp/debs/; then
                copied=$((copied + 1))
              fi
            done < <(find deb-source/prebuilt -type f -name '*.deb' -print0)
            echo "Prebuilt debs merged: ${copied}"
          else
            echo "No prebuilt directory found, skipping"
          fi

      - name: Download SDK debs from Release
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_RELEASE_TAG: 'rockchip-sdk-debs'
          REPO: ${{ github.repository }}
          SDK_FALLBACK_REPO: 'Seeed-Studio/seeed_armbian_extension'
        run: |
          echo "=== Downloading SDK debs from Release: ${SDK_RELEASE_TAG} ==="
          TMPDIR=$(mktemp -d)
          # Forks don't inherit Releases — if the tag is missing from the
          # current repo, fall back to the upstream repo that owns the SDK.
          download_sdk() {
            gh release download "${SDK_RELEASE_TAG}" \
              --repo "$1" \
              --dir "${TMPDIR}" \
              --pattern '*arm64*.tar.xz' \
              --clobber
          }
          if ! download_sdk "${REPO}"; then
            echo "::warning::Release ${SDK_RELEASE_TAG} not found in ${REPO}, trying upstream ${SDK_FALLBACK_REPO}"
            if ! download_sdk "${SDK_FALLBACK_REPO}"; then
              echo "::warning::Release ${SDK_RELEASE_TAG} not found in ${REPO} or ${SDK_FALLBACK_REPO}, skipping SDK debs"
              exit 0
            fi
          fi
          echo "Extracting archives..."
          for archive in "${TMPDIR}"/*.tar.xz; do
            echo "  Extracting: $(basename "${archive}")"
            tar -xf "${archive}" -C "${TMPDIR}"
          done
          echo "Downloaded $(find "${TMPDIR}" -name '*.deb' | wc -l) SDK debs"
          EXCLUDE_PKGS=$(find /tmp/debs -name '*.deb' -exec basename {} \; | sed 's/_.*//' | sort -u)
          echo "CI-built packages (will exclude from SDK): ${EXCLUDE_PKGS}"
          # Manifest of SDK-sourced debs — used by generate-deb-index.sh to
          # classify them as "Rockchip SDK" regardless of package name.
          : > /tmp/sdk-debs.manifest
          copied=0; skipped=0; seen_pkgs=""
          while IFS= read -r deb; do
            pkg_name=$(basename "${deb}" | sed 's/_.*//')
            if echo "${EXCLUDE_PKGS}" | grep -qxF "${pkg_name}"; then
              echo "  SKIP (conflicts with CI build): $(basename "${deb}")"
              skipped=$((skipped + 1))
            elif echo "${seen_pkgs}" | grep -qxF "${pkg_name}"; then
              echo "  SKIP (duplicate in SDK): $(basename "${deb}")"
              skipped=$((skipped + 1))
            else
              cp -vn "${deb}" /tmp/debs/ && copied=$((copied + 1))
              basename "${deb}" >> /tmp/sdk-debs.manifest
              seen_pkgs="${seen_pkgs}${pkg_name}"$'\n'
            fi
          done < <(find "${TMPDIR}" -name '*.deb')
          echo "  Copied ${copied} SDK debs, skipped ${skipped} conflicting"
          echo "  Manifest: $(wc -l < /tmp/sdk-debs.manifest) entries in /tmp/sdk-debs.manifest"

      - name: Fix cross-distro dependencies
        run: |
          # Replace libgcc1 with libgcc-s1 (libgcc1 removed in trixie,
          # libgcc-s1 available in bookworm, trixie, noble).
          fixed=0
          for deb in /tmp/debs/*.deb; do
            [ -f "${deb}" ] || continue
            if dpkg-deb -f "${deb}" depends 2>/dev/null | grep -q 'libgcc1'; then
              echo "Fixing deps: $(basename "${deb}")"
              tmpdir=$(mktemp -d)
              dpkg-deb -R "${deb}" "${tmpdir}"
              sed -i 's/libgcc1 (>= 1:4.2)/libgcc-s1/g' "${tmpdir}/DEBIAN/control"
              dpkg-deb -b "${tmpdir}" "${deb}"
              rm -rf "${tmpdir}"
              fixed=$((fixed + 1))
            fi
          done
          echo "Fixed ${fixed} packages"

      - name: List all debs (final)
        run: |
          echo "=== Final .deb list ==="
          find /tmp/debs -name '*.deb' -exec basename {} \; | sort
          echo "Total: $(find /tmp/debs -name '*.deb' | wc -l)"

      - name: Install aptly
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gnupg2

      - name: Import GPG key
        env:
          GPG_KEY_B64: ${{ secrets.ARMBIAN_APT_GPG_PRIVATE_KEY }}
        run: |
          echo "${GPG_KEY_B64}" | base64 -d | gpg --batch --import

      - name: Publish apt repository
        env:
          ARMBIAN_APT_GPG_KEY_ID: ${{ secrets.ARMBIAN_APT_GPG_KEY_ID }}
        run: |
          chmod +x scripts/*.sh .github/scripts/*.sh
          .github/scripts/publish-aptly.sh /tmp/debs

      - name: Generate deb index page
        run: |
          .github/scripts/generate-deb-index.sh /tmp/debs public/index.html /tmp/sdk-debs.manifest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  # ──────────────────────────────────────────────────
  # Deploy APT to this repository's project Pages. This site has exactly
  # one writer: the images page lives on the release repo's (owner/
  # armbian-build) gh-pages branch instead, so an apt deployment replaces
  # only the apt tree and carries nothing else. (The 2026-11-18 shared-
  # site design made each side carry the other's subtree — a lost-update
  # race plus a full apt re-upload on every images deploy; split back
  # 2026-11-19.)
  # ──────────────────────────────────────────────────
  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
