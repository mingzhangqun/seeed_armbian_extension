name: "Pages - Refresh"

# Re-render and re-push the images page against the CURRENT manifest
# state of the OneDrive mirror and the release list — e.g. after manual
# cleanup on OneDrive. Deploy-only: touches nothing but the gh-pages
# branch. Hard-fails if the manifest is unreadable — a refresh must
# never strip the links off a good page over a transient OneDrive
# outage.

on:
  workflow_dispatch:

# Serialize with builds and promotes: the manifest read must not race a
# slots.json flip.
concurrency:
  group: images-mirror
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The manifest read (≤4 rclone cats) replaced the share-link walk
    # that needed 45 minutes on a cold cache.
    timeout-minutes: 10
    # pages/id-token: deploy-pages actions-mode deployment.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Probe secrets
        id: probe
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          # Hard fail here: without rclone a refresh would deploy a page
          # with LINKS={} — stripping every file link for no reason.
          if [ -z "$RCLONE_CONFIG" ]; then
            echo "::error::RCLONE_CONFIG is not set — a refresh would strip all file links from the page; aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone (seeed-storage OneDrive remote)
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Check the manifest is readable
        id: mirror
        run: |
          set -euo pipefail
          # The release repo follows the owner/armbian-build convention
          # (same resolution as plan in build-images.yml).
          release_repo="${GITHUB_REPOSITORY_OWNER}/armbian-build"
          echo "release_repo=$release_repo" >> "$GITHUB_OUTPUT"
          echo "release repo: $release_repo"
          # The pointer file is the page's whole data source now —
          # readable means the page is buildable. (slots.json absent =
          # mirror state lost: restore the pointer file by hand.)
          if ! rclone cat seeed-storage:armbian/images/slots.json --contimeout 15s > /dev/null 2> cat.err; then
            echo "::error::slots.json unreadable — OneDrive unreachable, or the mirror's pointer file is gone. Restore it by hand: list trees/, then write {stable, pre-release, history} with the tags each slot should serve. $(tr '\n' ' ' < cat.err)"
            exit 1
          fi
          echo "slots.json OK"

      - name: Deploy images page
        uses: ./.github/actions/deploy-pages
        with:
          tag: refresh
          # The page always lives on the build-source repo (armbian-build),
          # pushed cross-repo to its gh-pages via the API (needs
          # PAGES_TARGET_TOKEN); no same-repo actions-mode deploys anymore.
          repo: ${{ steps.mirror.outputs.release_repo }}
          release_repo: ${{ steps.mirror.outputs.release_repo }}
          has_rclone: "true"
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          pages_token: ${{ secrets.PAGES_TARGET_TOKEN }}
          gh_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
