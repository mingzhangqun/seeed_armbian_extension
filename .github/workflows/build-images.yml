name: "Images - Build & Pre-release"

# Binaries go directly from each matrix runner to OneDrive. GitHub Releases
# carry only version/status metadata; no image assets are uploaded there.

on:
  workflow_dispatch:
    inputs:
      # ── Build source (which armbian-build branch to build from).
      armbian_build_repo:
        description: "armbian-build source (repo:branch; repo must be <owner>/armbian-build)"
        required: false
        type: string
        default: "armbian-build:main"

      # ── Boards (all on by default; missing boards are skipped in plan).
      # Input names ARE the board ids — plan derives the list from
      # toJSON(inputs); adding a board is one input here, nothing else.
      recomputer-rk3576-devkit:
        description: "Board: reComputer rk3576 DevKit"
        type: boolean
        default: true
      recomputer-rk3576-module-devkit:
        description: "Board: reComputer rk3576 Module DevKit"
        type: boolean
        default: true
      recomputer-rk3576-industrial:
        description: "Board: reComputer rk3576 Industrial"
        type: boolean
        default: true
      recomputer-rk3588-devkit:
        description: "Board: reComputer rk3588 DevKit"
        type: boolean
        default: true

      # ── Variants (always both): cli → Debian 13 trixie (--minimal);
      #    gnome → Ubuntu 26.04 resolute (desktop, sized by desktop_tier).

      # ── OTA modes (each becomes a matrix entry). recovery mandatory; ab opt-in.
      ota_ab:
        description: "OTA: A/B dual-partition"
        type: boolean
        default: false

      # ── Security. plain mandatory; secure-boot opt-in.
      secure_boot:
        description: "Security: secure-boot"
        type: boolean
        default: false

      # ── Other options
      desktop_tier:
        description: "Desktop tier size"
        required: true
        type: choice
        options:
          - minimal
          - mid
          - full
        default: mid

env:
  # ccache is an extension in current armbian-build; PRIVATE_CCACHE/USE_CCACHE
  # alone are ignored (see extensions/ccache.sh migration warning).
  ENABLE_EXTENSIONS: "ccache"
  PRIVATE_CCACHE: "yes"
  ENABLE_SEEED_RK_EXTENSION: "yes"
  KERNEL_CONFIGURE: "no"
  VENDOR: "Armbian"
  DOCKER_IMAGE: "ghcr.io/armbian/docker-armbian-build:armbian-ubuntu-noble-latest"

# Serialize every run that touches the images mirror (this group is shared
# with promote/refresh): init-release resets this run's tree while
# the matrix fills it, promote flips slots.json, the page reads the
# manifest — none of those may overlap. NOTE: GitHub keeps only ONE
# pending run per group — a later dispatch evicts a queued one, so verify
# a dispatched run actually started (dispatch is not delivery).
concurrency:
  group: images-mirror
  cancel-in-progress: false

jobs:
  preflight:
    # Fail fast on missing/malformed secrets BEFORE the multi-hour build.
    # Note: board_exists in plan job queries public repos by default;
    # if armbian_build_repo points to a private repo, plan needs
    # contents: read on that repo (token scope) — currently assumed public.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run preflight checks
        uses: ./.github/actions/preflight-checks
        with:
          secure_boot: ${{ inputs.secure_boot }}
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          private_key_pem: ${{ secrets.PRIVATE_KEY_PEM }}
          dev_crt: ${{ secrets.DEV_CRT }}
          cryptroot_passphrase: ${{ secrets.CRYPTROOT_PASSPHRASE }}

  plan:
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      boards: ${{ steps.gen.outputs.boards }}
      count: ${{ steps.gen.outputs.count }}
      tag: ${{ steps.gen.outputs.tag }}
      ab_repo: ${{ steps.gen.outputs.ab_repo }}
      ab_commit: ${{ steps.source.outputs.ab_commit }}
      release_repo: ${{ steps.gen.outputs.release_repo }}
    steps:
      - name: Generate matrix JSON from checkbox inputs
        id: gen
        run: |
          set -euo pipefail

          # Tag resolved ONCE here so init-release/upload/publish agree.
          # Rerun deliberately replaces this tag's candidate; it is not a
          # resume operation. A new dispatch receives a different run id.
          tag="$(date -u +%y%m%d-%H%M)-r${GITHUB_RUN_ID}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          import json, os, itertools

          def flag(name):
              v = os.environ.get(name, "false").strip().lower()
              return v in ("true", "1", "yes", "on")

          # Board ids are the input names — the form is the single source of truth.
          inputs = json.loads(os.environ["INPUTS_JSON"])
          boards = sorted(
              k for k, v in inputs.items()
              if k.startswith("recomputer-") and str(v).lower() in ("true", "1", "yes", "on")
          )

          if not boards:
              raise SystemExit("ERROR: select at least one board")

          # Boards missing from the chosen armbian-build source are dropped
          # (e.g. industrial until it merges). API hiccups keep the board —
          # the build then fails loudly instead of being silently skipped.
          import urllib.request, urllib.error
          ab_repo = os.environ.get("AB_REPO", "").strip()
          if not ab_repo:
              ab_repo = "armbian-build:main"
          # Auto-prepend repo owner if not specified (repo:branch → owner/repo:branch)
          if "/" not in ab_repo.split(":")[0]:
              owner = os.environ["GITHUB_REPOSITORY_OWNER"]
              repo_part, _, branch_part = ab_repo.partition(":")
              ab_repo = f"{owner}/{repo_part}:{branch_part}"
          repo, _, branch = ab_repo.partition(":")
          branch = branch or "main"
          expected_repo = f"{os.environ['GITHUB_REPOSITORY_OWNER']}/armbian-build"
          if repo != expected_repo:
              raise SystemExit(
                  f"ERROR: build source repo must be {expected_repo}, got {repo}; "
                  "promote and page deployment share that repository contract")

          def board_exists(board):
              headers = {"Accept": "application/vnd.github+json"}
              tok = os.environ.get("GH_TOKEN", "").strip()
              if tok:
                  headers["Authorization"] = f"Bearer {tok}"
              for ext in (".conf", ".csc"):
                  url = f"https://api.github.com/repos/{repo}/contents/config/boards/{board}{ext}?ref={branch}"
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          if r.status == 200:
                              return True
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          continue
                      raise
              return False

          present = []
          for b in boards:
              try:
                  ok = board_exists(b)
              except Exception as e:
                  print(f"::warning::board check failed for {b} ({e}); keeping it")
                  ok = True
              if ok:
                  present.append(b)
              else:
                  print(f"::notice::{b} is not in {repo}:{branch}; skipping it")
          boards = present
          if not boards:
              raise SystemExit(f"ERROR: none of the selected boards exist in {repo}:{branch}")

          # variants: (tier, release). Release is bound to the variant.
          variants = [("cli", "trixie"), ("gnome", "resolute")]

          otas = ["recovery"]
          if flag("OTA_AB"): otas.append("ab")

          securities = [""]
          if flag("SECURE_BOOT"): securities.append("secure-boot")

          entries = []
          for b, (t, r), p, s in itertools.product(boards, variants, otas, securities):
              entries.append({
                  "board": b,
                  "tier": t,
                  "release": r,
                  "profile": p,
                  "security": s,
              })

          print(f"::group::Matrix entries ({len(entries)})")
          for e in entries:
              print(f"  board={e['board']:<28} release={e['release']:<10} tier={e['tier']:<8} profile={e['profile'] or '(none)'} security={e['security'] or '(none)'}")
          print("::endgroup::")

          boards_unique = list(dict.fromkeys(boards))

          # release_repo: use the armbian-build repo (without branch)
          release_repo = repo

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': entries})}\n")
              f.write(f"boards={json.dumps(boards_unique)}\n")
              f.write(f"count={len(entries)}\n")
              f.write(f"ab_repo={ab_repo}\n")
              f.write(f"release_repo={release_repo}\n")
          PY
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          OTA_AB:       ${{ inputs.ota_ab }}
          SECURE_BOOT:  ${{ inputs.secure_boot }}
          AB_REPO:      ${{ inputs.armbian_build_repo }}
          GH_TOKEN:     ${{ github.token }}

      - name: Print summary
        run: |
          echo "Total matrix entries: ${{ steps.gen.outputs.count }}"
          echo "Boards to release: ${{ steps.gen.outputs.boards }}"
          echo "Release tag: ${{ steps.gen.outputs.tag }}"
          echo "Release target: ${{ steps.gen.outputs.release_repo }}"
          echo "armbian-build: ${{ steps.gen.outputs.ab_repo }}"

      - name: Resolve immutable build-source revision
        id: source
        env:
          AB_REPO: ${{ steps.gen.outputs.ab_repo }}
        run: |
          set -euo pipefail
          ab_commit="$(gh api "repos/${AB_REPO%:*}/git/refs/heads/${AB_REPO##*:}" --jq .object.sha)"
          [[ "$ab_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid armbian-build commit"; exit 1; }
          echo "ab_commit=$ab_commit" >> "$GITHUB_OUTPUT"
          echo "Pinned armbian-build source: ${AB_REPO%:*}@$ab_commit"

  # Creates the single draft release all entries upload into, and resets
  # this run's tag-addressed staging tree on the OneDrive mirror.
  init-release:
    name: Init draft release
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone (seeed-storage OneDrive remote)
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Retire the current candidate before building
        id: retire
        run: |
          set -euo pipefail
          IBASE="seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}/images"
          old="$(rclone cat "$IBASE/slots.json" --contimeout 15s | jq -r '."pre-release" // empty')"
          [ -n "$old" ] || { echo "no current candidate to retire"; exit 0; }
          echo "retiring candidate $old before the new build"
          rclone cat "$IBASE/slots.json" --contimeout 15s | jq \
            --arg old "$old" \
            'if ."pre-release" != $old then error("slots.json changed during candidate retirement") else ."pre-release" = null end' \
            | rclone rcat "$IBASE/slots.json"
          check="$(rclone cat "$IBASE/slots.json" --contimeout 15s | jq -r '."pre-release" // empty')"
          [ -z "$check" ] || { echo "::error::candidate $check appeared during retirement; refusing to overwrite"; exit 1; }
          echo "tag=$old" >> "$GITHUB_OUTPUT"

      - name: Hide the retired candidate before deleting its tree
        if: ${{ steps.retire.outputs.tag != '' }}
        uses: ./.github/actions/deploy-pages
        with:
          tag: retire-${{ needs.plan.outputs.tag }}
          repo: ${{ needs.plan.outputs.release_repo }}
          release_repo: ${{ needs.plan.outputs.release_repo }}
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          pages_token: ${{ secrets.PAGES_TARGET_TOKEN }}
          gh_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Reset staging + garbage-collect unreferenced trees
        id: reset
        # Tag-addressed layout: staging is trees/<tag>/ (not a shared
        # slot), so the reset is scoped to THIS run's tag — same-minute
        # re-runs start fresh without touching the slots a page render
        # depends on. The GC replaces the old "purge the whole
        # pre-release slot" janitor: promote runs manually, sometimes
        # several builds apart, and every build leaves a full tree
        # (~70-90 files, tens of GB) behind — unreferenced trees must be
        # purged here or the mirror grows without bound between promotes.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # The mirror is namespaced per pipeline owner (the fork and
          # upstream would otherwise fight over one global slots.json):
          # armbian/<owner>/images.
          MBASE="seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}"
          # slots.json doubles as the namespace's state file: absent means
          # the mirror was never initialized (or the pointer was lost) —
          # every new-code path (upload/pointer/page) would misfire,
          # refuse instead.
          if ! rclone cat "$MBASE/images/slots.json" --contimeout 15s >/dev/null 2>&1; then
            echo "::error::$MBASE/images/slots.json not found — the mirror's pointer file is missing. Restore it by hand: list trees/, then write {stable, pre-release, history} with the tags each slot should serve."
            exit 1
          fi
          # The page no longer exposes the old candidate. Purge its tree
          # only after that deploy succeeded; Rerun intentionally discards
          # and rebuilds this tag rather than resuming a published build.
          if [ -n "${{ steps.retire.outputs.tag }}" ]; then
            rclone purge "$MBASE/images/trees/${{ steps.retire.outputs.tag }}" --contimeout 15s
          fi
          rclone purge "$MBASE/images/trees/$TAG" --contimeout 15s 2>/dev/null \
            || echo "$MBASE/images/trees/$TAG did not exist (fresh tag) — nothing to purge"

          python3 <<'PY'
          import json, os, subprocess, sys

          tag = os.environ["TAG"]
          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"

          def rcat(path):
              r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::rclone cat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return r.stdout

          def lsdirs(path):
              r = subprocess.run(["rclone", "lsjson", "--dirs-only", path],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  if "not found" in r.stderr.lower():
                      return []    # trees/ not created yet — nothing to GC
                  print(f"::error::lsjson failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return [it["Path"] for it in json.loads(r.stdout or "[]")]

          slots = json.loads(rcat(f"{IBASE}/slots.json"))
          # referenced = primary slots + the history array (tolerate the
          # legacy scalar "previous")
          hist = slots.get("history")
          if not isinstance(hist, list):
              hist = [slots["previous"]] if slots.get("previous") else []
          referenced = {t for t in (slots.get("stable"), slots.get("pre-release"),
                                    *hist) if t}

          # The manifest and loaders are purged with their tree. Never
          # touch armbian/images or armbian/loaders: those global roots
          # are OUTSIDE this owner's namespace and may belong to another
          # pipeline. Legacy migration cleanup must be a separate opt-in.
          for t in lsdirs(f"{IBASE}/trees"):
              if t == tag or t in referenced:
                  continue
              print(f"::notice::purging unreferenced tree {t}")
              subprocess.run(["rclone", "purge", f"{IBASE}/trees/{t}"], check=True)
          print(f"GC done: referenced tags {sorted(referenced) or 'none'}, this run's tag {tag}")
          PY

      - name: Remove the retired candidate Release
        if: ${{ steps.retire.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TARGET_REPO: ${{ needs.plan.outputs.release_repo }}
          OLD_TAG: ${{ steps.retire.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(gh release view "$OLD_TAG" --repo "$TARGET_REPO" \
            --json isDraft,isPrerelease,assets,body --jq '[.isDraft,.isPrerelease,(.assets|length),.body]|@json' 2>/dev/null || true)"
          [ -n "$state" ] || { echo "retired candidate Release $OLD_TAG is already absent"; exit 0; }
          if [ "$(jq -r '.[0] or (.[1]|not) or (.[2] > 0)' <<<"$state")" = "true" ]; then
            echo "::error::$OLD_TAG is not an asset-less pre-release; refusing to delete it"
            exit 1
          fi
          jq -r '.[3]' <<<"$state" | grep -qE "${GITHUB_REPOSITORY}/actions/runs/[0-9]+" \
            || { echo "::error::$OLD_TAG is not owned by this pipeline; refusing to delete it"; exit 1; }
          gh release delete "$OLD_TAG" --repo "$TARGET_REPO" --yes --cleanup-tag

      - name: Create draft release ${{ needs.plan.outputs.tag }}
        env:
          # Cross-repo targets need RELEASE_GH_TOKEN (PAT with contents:write);
          # same-repo falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TARGET_REPO: ${{ needs.plan.outputs.release_repo }}
          TAG: ${{ needs.plan.outputs.tag }}
          BOARDS: ${{ needs.plan.outputs.boards }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          # Rerun discards this tag's candidate and rebuilds it. The old
          # pre-release has already been hidden and purged above.
          if gh release view "${TAG}" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            state="$(gh release view "$TAG" --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
            [ "$state" = "true true" ] || [ "$state" = "false true" ] \
              || { echo "::error::${TAG} is not a pre-release (state: $state); refusing to replace it"; exit 1; }
            gh release delete "${TAG}" --repo "$TARGET_REPO" --yes
            gh api --method DELETE "repos/$TARGET_REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          fi
          # --target must name a ref of the RELEASE repo.
          target_args=()
          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            target_args=(--target "$GITHUB_SHA")
          fi
          # Self-describing title derived from the tag (YYMMDD-HHMM UTC).
          # No build-info asset: the tree's manifest.json (its "tag"
          # field is the build signature, promote verifies it) is the
          # only metadata; the release itself carries none.
          boards_n="$(jq length <<<"$BOARDS")"
          images_n="$(jq '.include | length' <<<"$MATRIX")"
          title="Images 20${TAG:0:2}-${TAG:2:2}-${TAG:4:2} ${TAG:7:2}:${TAG:9:2} UTC · ${boards_n} boards · ${images_n} images"
          gh release create "${TAG}" \
            --repo "$TARGET_REPO" \
            --draft \
            --prerelease \
            --title "$title" \
            "${target_args[@]}" \
            --notes "Binaries are published only in the OneDrive mirror; this Release carries version metadata. Downloads are on the images page. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # A build run discards any previous candidate at init. Rerun rebuilds
  # this tag; use Pages - Refresh for a page-only failure instead.

  build:
    needs: [plan, init-release]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      EXTENSION_SHA: ${{ github.sha }}
      BUILD_SOURCE_REPO: ${{ needs.plan.outputs.release_repo }}
      BUILD_SOURCE_SHA: ${{ needs.plan.outputs.ab_commit }}
      BOARD: ${{ matrix.board }}

    steps:
      # Extension rev is pinned inside armbian-build's seeed-extension.sh
      # (SEEED_EXTENSION_REF), so no ref input here.
      - name: Checkout extension (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable extension source revision
        run: |
          test "$(git rev-parse HEAD)" = "$EXTENSION_SHA"
          echo "Verified extension checkout: $EXTENSION_SHA"

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/boost /usr/local/share/openssl
          sudo apt-get purge -y --auto-remove \
                     'ghc-*' 'dotnet-*' 'llvm-*' 'azure-cli*' \
                     'firefox*' 'google-chrome*' 'powershell*' 'snapd' || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          docker system prune -af --volumes || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install qemu-user-binfmt for cross-arch rootfs chroot
        # qemu-user-binfmt registers qemu-aarch64 etc on the host with the
        # fix-binary flag so containers can chroot into arm64 rootfs.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt binfmt-support
          echo "=== binfmt_misc registrations (host) ==="
          ls /proc/sys/fs/binfmt_misc/ || true
          echo "=== qemu-aarch64 entry ==="
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || echo "qemu-aarch64 not registered"

      - name: Resolve armbian-build repo
        # input is repo:branch or owner/repo:branch — validate and split.
        # Auto-prepends repo owner if missing (plan-resolved).
        id: abrepo
        env:
          AB_REPO: ${{ needs.plan.outputs.ab_repo }}
          AB_COMMIT: ${{ needs.plan.outputs.ab_commit }}
        run: |
          set -euo pipefail
          [[ "${AB_REPO}" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)?:[A-Za-z0-9._/-]+$ ]] \
            || { echo "::error::armbian_build_repo must be 'owner/repo:branch', got '${AB_REPO}'"; exit 1; }
          echo "repo=${AB_REPO%:*}" >> "$GITHUB_OUTPUT"
          echo "ref=${AB_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "armbian-build: ${AB_REPO%:*} @ ${AB_COMMIT}"

      - name: Checkout armbian-build
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.abrepo.outputs.repo }}
          ref: ${{ steps.abrepo.outputs.ref }}
          path: armbian-build
          fetch-depth: 1

      - name: Verify immutable build-source revision
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.ab_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Verified armbian-build checkout: $SOURCE_SHA"

      - name: Add trailing blank line to vendor defconfigs
        run: |
          cd armbian-build
          # covers non-devkit boards (recomputer-rk3576-industrial) too
          for f in patch/u-boot/legacy/u-boot-radxa-rk35xx/defconfig/recomputer-rk35*_defconfig; do
            [[ -f "$f" ]] || continue
            echo "" >> "$f"
            echo "Added trailing blank line to $f"
          done

      - name: Patch armbian docker.sh to forward CRYPTROOT_PASSPHRASE
        run: |
          cd armbian-build
          sed -i '/"--env" "ARMBIAN_RUNNING_IN_CONTAINER=yes"/a\\t\t"--env" "CRYPTROOT_PASSPHRASE=${CRYPTROOT_PASSPHRASE:-}"' \
              lib/functions/host/docker.sh
          # Same container boundary: SEEED_EXTENSION_REPO/REF exported on the
          # host never reach the wrapper sourcing inside the container, so the
          # extension fetch silently falls back to upstream main.
          sed -i '/"--env" "CRYPTROOT_PASSPHRASE=/a\\t\t"--env" "SEEED_EXTENSION_REPO=${SEEED_EXTENSION_REPO:-}"\n\t\t"--env" "SEEED_EXTENSION_REF=${SEEED_EXTENSION_REF:-}"' \
              lib/functions/host/docker.sh
          echo "=== env forwarding in docker.sh ==="
          grep -nE 'CRYPTROOT_PASSPHRASE|SEEED_EXTENSION_(REPO|REF)' lib/functions/host/docker.sh

      - name: Patch radxa-aic8800 extension against GitHub API flakiness
        # api.github.com flakes on CI; upstream resolves the version to
        # "null" and wget 404s. Patch adds version pin + cache fallback.
        run: |
          cd armbian-build
          git apply "${GITHUB_WORKSPACE}/.github/patchs/radxa-aic8800.sh.patch"
          echo "=== patched radxa-aic8800.sh ==="
          grep -n "AIC8800_FALLBACK_VERSION\|aic8800_download_file_with_cache" extensions/radxa-aic8800.sh | head -5

      - name: Pre-create rkbin symlink for A/B OTA
        if: ${{ matrix.profile == 'ab' }}
        run: |
          cd armbian-build
          mkdir -p cache/sources/u-boot-worktree/u-boot-rockchip64
          ln -sfn ../../rkbin-tools cache/sources/u-boot-worktree/u-boot-rockchip64/rkbin
          echo "=== rkbin symlink ==="
          ls -la cache/sources/u-boot-worktree/u-boot-rockchip64/

      - name: Place FIT signing keys for secure profiles
        if: ${{ matrix.security == 'secure-boot' }}
        run: |
          set -euo pipefail
          cd armbian-build
          mkdir -p cache/sources/fit-keys
          printf '%s\n' "${PRIVATE_KEY_PEM}" > cache/sources/fit-keys/private_key.pem
          printf '%s\n' "${DEV_CRT}" > cache/sources/fit-keys/dev.crt
          chmod 0600 cache/sources/fit-keys/private_key.pem
          chmod 0644 cache/sources/fit-keys/dev.crt
          echo "=== FIT keys placed at cache/sources/fit-keys ==="
          ls -la cache/sources/fit-keys/
          echo "=== Key sanity check ==="
          openssl rsa -in cache/sources/fit-keys/private_key.pem -check -noout 2>&1 || true
          openssl x509 -in cache/sources/fit-keys/dev.crt -noout -subject 2>&1 || true
        env:
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
          DEV_CRT: ${{ secrets.DEV_CRT }}

      - name: Symlink build.sh into armbian-build root
        run: |
          ln -sf "$GITHUB_WORKSPACE/scripts/build.sh" armbian-build/seeed-build.sh
          ls -la armbian-build/seeed-build.sh

      - name: Pull docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      - name: Restore armbian deb packages cache
        uses: actions/cache@v4
        with:
          path: |
            armbian-build/output/debs
            armbian-build/output/packages-hashed
          key: debs-arm64-${{ matrix.board }}-vendor-${{ hashFiles('armbian-build/config/sources/families/seeed-rk*.conf', 'armbian-build/config/sources/families/rk35xx.conf', 'armbian-build/config/sources/vendors/seeed-studio/*.inc') }}
          restore-keys: |
            debs-arm64-${{ matrix.board }}-vendor-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: armbian-build/cache/ccache
          key: ccache-arm64-${{ matrix.board }}-vendor-${{ github.sha }}
          restore-keys: |
            ccache-arm64-${{ matrix.board }}-vendor-
            ccache-arm64-${{ matrix.board }}-

      # rootfs cache disabled: each entry ~2 GiB × N variants would blow the
      # 10 GiB repo cache and evict the kernel debs cache (30+ min rebuild).
      # Rootfs from scratch is only ~10 min.

      # The armbian-build wrapper extensions/seeed-extension.sh hardcodes the
      # UPSTREAM extension repo (Seeed-Studio/seeed_armbian_extension @ main),
      # so every build would compile the upstream code and never the fixes on
      # the dispatched ref of THIS repo. Make the repo overridable (the ref
      # already is via SEEED_EXTENSION_REF) and point both at this checkout.
      - name: Point seeed-extension at this checkout
        run: |
          cd armbian-build
          sed -i \
            -e 's|^SEEED_EXTENSION_REPO=.*|SEEED_EXTENSION_REPO="${SEEED_EXTENSION_REPO:-https://github.com/Seeed-Studio/seeed_armbian_extension}"|' \
            extensions/seeed-extension.sh
          echo "=== seeed-extension repo/ref now overridable ==="
          grep -n 'SEEED_EXTENSION_REPO=\|SEEED_EXTENSION_REF=' extensions/seeed-extension.sh | head -4

      - name: Build
        working-directory: armbian-build
        env:
          PROFILE: ${{ matrix.profile }}
          SECURITY: ${{ matrix.security }}
          TIER: ${{ matrix.tier }}
          BOARD: ${{ matrix.board }}
          RELEASE: ${{ matrix.release }}
          DESKTOP_TIER: ${{ inputs.desktop_tier }}
        run: |
          set -euo pipefail
          # Build the extension code from this workflow's repo + ref, not the
          # upstream main the armbian-build wrapper pins by default.
          export SEEED_EXTENSION_REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          export SEEED_EXTENSION_REF="commit:${GITHUB_SHA}"
          echo "extension source: ${SEEED_EXTENSION_REPO} @ ${SEEED_EXTENSION_REF}"
          # cli → --minimal (Debian 13); gnome → desktop (Ubuntu 26.04)
          # sized by the desktop_tier choice.
          TIER_ARGS=""
          if [[ "$TIER" == "cli" ]]; then
              TIER_ARGS="--minimal"
          else
              TIER_ARGS="-d gnome -t $DESKTOP_TIER"
          fi

          # Passphrase only when a security profile is set (preflight-validated).
          if [[ -n "$SECURITY" ]]; then
              export CRYPTROOT_PASSPHRASE="${{ secrets.CRYPTROOT_PASSPHRASE }}"
          fi

          if [[ -d cache/sources/fit-keys ]]; then
              export UBOOT_FIT_KEYS_BACKUP_DIR="/armbian/cache/sources/fit-keys"
          fi

          # shellcheck disable=SC2086
          ./seeed-build.sh \
            $PROFILE \
            $SECURITY \
            -b "$BOARD" \
            -R "$RELEASE" \
            $TIER_ARGS

      - name: Compress .img to .img.xz + sha256
        if: always()
        working-directory: armbian-build
        run: |
          set -euo pipefail
          shopt -s nullglob
          for img in output/images/*.img; do
            base="$(basename "$img" .img).img.xz"
            echo "Compressing $img -> output/images/$base"
            xz -T0 -6 -v < "$img" > "output/images/$base"
            ( cd output/images && sha256sum "$base" > "$base.sha256" )
            echo "Removing uncompressed $img"
            rm -f "$img"
          done
          echo "=== output/images/ contents ==="
          ls -lh output/images/

      - name: Setup rclone (seeed-storage OneDrive remote)
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Upload images to this tag's tree (OneDrive mode)
        # dest = .../trees/<tag>/<board>/<sec>/<profile>[/ota]/ — security
        # is a STRUCTURAL directory level (plain|secure), matching the
        # manifest and the page's security-group rendering; profile is
        # recovery|ab. The tree never moves; promote only flips slots.json.
        # The release job links these files into trees/<tag>/manifest.json
        # after the matrix lands; promote validates the tree shape then.
        working-directory: armbian-build
        env:
          PROFILE: ${{ matrix.profile || 'recovery' }}
          SECURITY: ${{ matrix.security }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(output/images/*.img.xz output/images/*.sha256 output/images/*.sha output/images/*.img.txt)
          ota_files=(output/images/$BOARD/ota/*)
          if [ ${#files[@]} -eq 0 ] || [ ${#ota_files[@]} -eq 0 ]; then
            echo "::error::incomplete matrix output: ${#files[@]} image metadata file(s), ${#ota_files[@]} OTA file(s)"
            exit 1
          fi
          if ! compgen -G 'output/images/*.img.xz' > /dev/null; then
            echo "::error::no compressed .img.xz found; refusing an OTA-only partial leg"
            exit 1
          fi

          sec_dir="plain"
          [ -n "$SECURITY" ] && sec_dir="secure"
          dest="seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}/images/trees/$TAG/$BOARD/$sec_dir/$PROFILE"
          echo "Uploading to $dest"
          rclone mkdir "$dest" 2>/dev/null || true
          rclone copy output/images/ "$dest" \
            --include "*.img.xz" --include "*.img.xz.sha256" --include "*.img.sha" --include "*.img.txt" \
            --transfers 4 --stats-one-line --stats 30s
          if [ ${#ota_files[@]} -gt 0 ]; then
            rclone mkdir "$dest/ota" 2>/dev/null || true
            rclone copy "output/images/$BOARD/ota/" "$dest/ota" \
              --transfers 4 --stats-one-line --stats 30s
          fi

      - name: Upload production loaders to this tag's tree
        # Board u-boot production artifacts (spl_loader_maskrom.bin and, for
        # layouts that build one, rkspi_loader.img), exported by the
        # extension's pre_umount_final_image__902 hook into
        # output/images/loaders/<board>/<plain|secure>/. The u-boot payload
        # is identical across tiers and OTA profiles of the same
        # board+security, so ONLY the reference leg (cli/trixie/recovery)
        # uploads — parallel legs would race the same dest paths with
        # differently-timestamped binaries. Missing rkspi_loader.img for
        # boards without BOOT_SUPPORT_SPI is expected, not an error.
        # Dest: trees/<tag>/<board>/<sec>/loaders/ — loaders sit INSIDE
        # their security level as a kind sibling of recovery|ab (one
        # build, one purge unit, one manifest map).
        if: ${{ matrix.tier == 'cli' && matrix.release == 'trixie' && (matrix.profile || 'recovery') == 'recovery' }}
        working-directory: armbian-build
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(output/images/loaders/*/*)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::no loaders found under output/images/loaders/ — did pre_umount_final_image__902_export_production_loaders run?"
            exit 1
          fi
          for d in "${dirs[@]}"; do
            board="$(basename "$(dirname "$d")")"
            sec="$(basename "$d")"
            dest="seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}/images/trees/$TAG/$board/$sec/loaders"
            echo "Uploading loaders to $dest"
            rclone mkdir "$dest" 2>/dev/null || true
            rclone copy "$d/" "$dest" \
              --include "*.xz" --include "*.xz.sha256" \
              --transfers 4 --stats-one-line --stats 30s
          done

      - name: Upload output/images/ as-is
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-img-${{ matrix.board }}-${{ matrix.release }}-${{ matrix.tier }}-${{ matrix.profile || 'recovery' }}-${{ matrix.security || 'plain' }}-${{ github.run_id }}
          path: armbian-build/output/images/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Print ccache stats
        if: always()
        run: |
          command -v ccache >/dev/null 2>&1 || { echo "ccache not installed on host; install with: sudo apt-get install -y ccache"; exit 0; }
          ccache -s 2>/dev/null || true
          du -sh armbian-build/cache/ccache 2>/dev/null || true

  release:
    needs: [plan, init-release, build]
    # Finalizes the tag's tree after all entries upload: share links →
    # manifest → slot pointer → THEN flips the draft release visible.
    # Promotion to Stable is promote-images.yml (separate dispatch).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # The per-file rclone link calls (~70-90 files, OneDrive throttling
    # seen at scale) sit between a multi-hour matrix success and the
    # publish — give them room.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
      TARGET_REPO: ${{ needs.plan.outputs.release_repo }}
      TAG: ${{ needs.plan.outputs.tag }}
      EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
      BUILD_SOURCE_REPO: ${{ needs.plan.outputs.release_repo }}
      EXTENSION_SHA: ${{ github.sha }}
      BUILD_SOURCE_SHA: ${{ needs.plan.outputs.ab_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone (seeed-storage OneDrive remote)
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Link the tree, write manifest + slot pointer
        # Ordering is the crash contract (same principle as the old
        # <slot>/tag write): manifest and pointer land BEFORE the release
        # becomes visible, so a publish implies a fully-linked tree. A
        # crash mid-sequence leaves a draft release — cleanup rolls the
        # tree, manifest AND pointer back.
        # The slots.json update is a poor-man's CAS: re-read immediately
        # before writing and abort if stable/previous changed since the
        # first read — CI writers are serialized by the images-mirror
        # group, but a human editing the file via the OneDrive web UI
        # must not be silently clobbered.
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys, time
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"

          def lsjson_files(path):
              r = subprocess.run(["rclone", "lsjson", "-R", "--files-only", path],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::lsjson failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)
              return [it["Path"] for it in json.loads(r.stdout or "[]")]

          def rcat(path, content):
              r = subprocess.run(["rclone", "rcat", path], input=content,
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::error::rcat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
                  sys.exit(1)

          # ONE recursive walk of the tag's tree; ONE flat map — keys are
          # tree-relative paths ("<board>/<sec>/<kind>/[ota/]<file>"), no
          # tag prefix (the manifest stays valid whichever slot later
          # points at it) and no per-section splitting: loaders and
          # images share the map, told apart by the kind segment exactly
          # like the page does. The manifest itself is written after
          # this walk, so no root identity file exists yet.
          rel_files = [p for p in lsjson_files(f"{IBASE}/trees/{tag}")
                       if p != "manifest.json"]
          if not rel_files:
              print(f"::error::trees/{tag} is empty — refusing to publish", file=sys.stderr)
              sys.exit(1)

          # Matrix results are a contract, not just a best-effort upload.
          # Missing loaders do not invalidate images, but every planned leg
          # must have a compressed image and at least one OTA payload.
          planned = json.loads(os.environ["EXPECTED_MATRIX"])["include"]
          for leg in planned:
              sec = "secure" if leg["security"] else "plain"
              prefix = f"{leg['board']}/{sec}/{leg['profile']}/"
              leg_files = [p for p in rel_files if p.startswith(prefix)]
              if not any(p.endswith(".img.xz") for p in leg_files):
                  print(f"::error::{prefix}: no .img.xz uploaded", file=sys.stderr)
                  sys.exit(1)
              if not any(p.startswith(prefix + "ota/") and not p.endswith(".checksums")
                         for p in leg_files):
                  print(f"::error::{prefix}ota/: no OTA payload uploaded", file=sys.stderr)
                  sys.exit(1)
          print(f"matrix coverage OK: {len(planned)} complete legs")

          def make_link(rel):
              dest = f"{IBASE}/trees/{tag}/{rel}"
              for attempt in (1, 2):
                  lr = subprocess.run(["rclone", "link", "--timeout", "60s", dest],
                                      capture_output=True, text=True)
                  if lr.returncode == 0 and lr.stdout.strip():
                      return rel, True, lr.stdout.strip()
                  err = lr.stderr.strip()
                  if attempt == 1:
                      time.sleep(3)
              return rel, False, err

          files_map, failures = {}, []
          with ThreadPoolExecutor(max_workers=4) as ex:
              for i, (rel, ok, res) in enumerate(ex.map(make_link, rel_files), 1):
                  if ok:
                      files_map[rel] = res
                  else:
                      failures.append(rel)
                      print(f"::warning::link failed: {rel}: {res}", file=sys.stderr)
                  if i % 25 == 0:
                      print(f"  … {i}/{len(rel_files)} links", file=sys.stderr)
          if failures:
              print(f"::error::{len(failures)}/{len(rel_files)} share links failed — refusing to publish an incomplete manifest", file=sys.stderr)
              sys.exit(1)
          if set(files_map) != set(rel_files):
              print("::error::manifest link coverage differs from the uploaded tree", file=sys.stderr)
              sys.exit(1)

          manifest = {
              "tag": tag,
              "created": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": {"repo": os.environ["BUILD_SOURCE_REPO"],
                         "commit": os.environ["BUILD_SOURCE_SHA"]},
              "extension": {"repo": os.environ["GITHUB_REPOSITORY"],
                            "commit": os.environ["EXTENSION_SHA"]},
              "files": files_map,
          }
          rcat(f"{IBASE}/trees/{tag}/manifest.json", json.dumps(manifest, indent=1, sort_keys=True))
          print(f"manifest written into trees/{tag}/: {len(files_map)} links, {len(failures)} failures")

          # slots.json pointer — read-verify-write.
          r = subprocess.run(["rclone", "cat", f"{IBASE}/slots.json", "--contimeout", "15s"],
                             capture_output=True, text=True)
          if r.returncode != 0:
              print(f"::error::cannot read slots.json: {r.stderr.strip()}", file=sys.stderr)
              sys.exit(1)
          slots = json.loads(r.stdout)
          expected = {k: slots.get(k) for k in ("stable", "history")}
          r2 = subprocess.run(["rclone", "cat", f"{IBASE}/slots.json", "--contimeout", "15s"],
                              capture_output=True, text=True)
          if r2.returncode != 0 or {k: json.loads(r2.stdout).get(k) for k in ("stable", "history")} != expected:
              print("::error::slots.json changed between reads — a concurrent writer (human edit?) is active; aborting", file=sys.stderr)
              sys.exit(1)
          slots["pre-release"] = tag
          rcat(f"{IBASE}/slots.json", json.dumps(slots, indent=1, sort_keys=True) + "\n")
          print(f"slots.json: pre-release → {tag} (stable/previous untouched)")
          PY

      - name: Publish release
        run: |
          set -euo pipefail
          # Mirror state is complete (manifest + pointer) — flip visible.
          gh release edit "$TAG" \
            --repo "$TARGET_REPO" \
            --draft=false \
            --prerelease \
            --latest=false

  # Template/config sync for the images page. The manifest read (≤4
  # rclone cats) replaced the mirror walk, so this is fast again.
  pages:
    name: Deploy images page (template sync)
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    # The gh-pages push authenticates with PAGES_TARGET_TOKEN (a PAT);
    # GITHUB_TOKEN only reads the release list.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy images page
        uses: ./.github/actions/deploy-pages
        with:
          tag: ${{ needs.plan.outputs.tag }}
          # The page always lives on the build-source repo (armbian-build),
          # pushed to its gh-pages via the API (needs PAGES_TARGET_TOKEN).
          repo: ${{ needs.plan.outputs.release_repo }}
          release_repo: ${{ needs.plan.outputs.release_repo }}
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          pages_token: ${{ secrets.PAGES_TARGET_TOKEN }}
          gh_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

  cleanup:
    name: Cleanup draft release (cancel/failure)
    # Full chain so this runs LAST, after cancelled matrix jobs are fully
    # terminal — no racing uploads while we delete/purge. The
    # images-mirror concurrency group is held until this run completes,
    # so a queued build cannot start filling the slot mid-purge either.
    # On success neither cancelled() nor failure() holds and this skips.
    # Ported from test-build.yml (deleted 2026-11-05) — its cleanup was
    # the only draft sweeper in the repo.
    needs: [preflight, plan, init-release, build, release, pages]
    if: ${{ always() && (cancelled() || failure()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
      TARGET_REPO: ${{ needs.plan.outputs.release_repo }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rclone (seeed-storage OneDrive remote)
        uses: ./.github/actions/setup-onedrive
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Delete orphaned draft + partial tree + slot pointer
        id: cleanup-pointer
        # Discard only this attempt's candidate and its pointer; a tag
        # already promoted to Stable is never cleaned up as a candidate.
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "plan produced no tag — nothing was created; nothing to clean"
            exit 0
          fi
          # Every build attempt owns its candidate. A failed/cancelled run
          # discards that candidate; Rerun starts fresh rather than resuming
          # a previously published tree.
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            state="$(gh release view "$TAG" --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
            [ "$state" = "true true" ] || [ "$state" = "false true" ] \
              || { echo "::error::$TAG is no longer a pre-release (state: $state); refusing cleanup"; exit 1; }
            gh release view "$TAG" --repo "$TARGET_REPO" --json body --jq .body \
              | grep -qE "${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}([/[:space:]]|$)" \
              || { echo "::error::$TAG is not owned by run ${GITHUB_RUN_ID}; refusing cleanup"; exit 1; }
            gh release delete "$TAG" --repo "$TARGET_REPO" --yes
            gh api --method DELETE "repos/$TARGET_REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
            echo "deleted this attempt's candidate Release $TAG"
          fi
          # Rerun owns this tag across attempts; always clear its tree,
          # even when the Release was already published before the failure.
          rclone purge "seeed-storage:armbian/${GITHUB_REPOSITORY_OWNER,,}/images/trees/$TAG" --contimeout 15s 2>/dev/null \
            || echo "trees/$TAG did not exist — nothing to purge"
          python3 - "$TAG" <<'PY'
          import json, os, subprocess, sys

          tag = sys.argv[1]
          path = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images/slots.json"
          r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                             capture_output=True, text=True)
          if r.returncode != 0:
              print(f"::error::cannot read slots.json ({r.stderr.strip()}) — pointer left untouched", file=sys.stderr)
              sys.exit(1)
          slots = json.loads(r.stdout)
          if slots.get("pre-release") != tag:
              print(f"pointer intact (pre-release = {slots.get('pre-release')!r}) — nothing to clear")
              sys.exit(0)
          slots["pre-release"] = None
          w = subprocess.run(["rclone", "rcat", path],
                             input=json.dumps(slots, indent=1, sort_keys=True) + "\n",
                             capture_output=True, text=True)
          if w.returncode != 0:
              print(f"::error::failed to clear this run's pre-release pointer ({w.stderr.strip()})", file=sys.stderr)
              sys.exit(1)
          print("slots.json: this attempt's pre-release cleared")
          print("cleared=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PY

      - name: Refresh the page after failure cleanup
        if: ${{ steps.cleanup-pointer.outputs.cleared == 'true' }}
        uses: ./.github/actions/deploy-pages
        with:
          tag: cleanup-${{ needs.plan.outputs.tag }}
          repo: ${{ needs.plan.outputs.release_repo }}
          release_repo: ${{ needs.plan.outputs.release_repo }}
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          pages_token: ${{ secrets.PAGES_TARGET_TOKEN }}
          gh_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
