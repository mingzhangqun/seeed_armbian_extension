name: "Deploy images page"
description: "Bundle the mirror manifest into data.json, stage the static page, and deploy via the official Pages Actions pipeline"

inputs:
  tag:
    description: "Release tag (used in deployment context)"
    required: true
  release_repo:
    description: "Repo where the release lives (owner/repo)"
    required: true
  rclone_config:
    description: "RCLONE_CONFIG secret content (required for the mirror manifest)"
    required: true
  gh_token:
    description: "GH_TOKEN for release/repo API calls (needs contents:read to list releases, pages:read for the deploy gate)"
    required: true

# Callers must grant this job `pages: write` and `id-token: write`:
# actions/deploy-pages deploys THIS repository's Pages site with
# GITHUB_TOKEN — no gh-pages branch and no cross-repo PAT.

runs:
  using: "composite"
  steps:
    # The page deploys to the extension repo's (the workflow's own
    # repository) Pages site through the official artifact pipeline.
    # Release metadata still comes from `release_repo` (owner/armbian-build,
    # where the Releases and the device OTA contract live). The former
    # gh-pages branch push (git data API + POST /pages/builds + stale-
    # content watchdog) was removed 2026-11-18: an artifact deployment is
    # atomic, so there is no commit-pushed-but-not-built window to guard.
    - name: Resolve deploy gate
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        # Skip with a notice when the site is not enabled for "GitHub
        # Actions" source yet — mirroring the old missing-token skip so an
        # unconfigured repo never fails a green run.
        info="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type, source}' 2>/dev/null || true)"
        if [ -z "$info" ] || [ "$(jq -r '.build_type // empty' <<<"$info")" != "workflow" ]; then
          echo "::notice::Pages site is not enabled with 'GitHub Actions' source — images page deploy skipped. Enable it once in Settings → Pages."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "deploy: official Pages Actions deployment to ${GITHUB_REPOSITORY}"
        fi

    - name: Checkout (page generator)
      if: steps.gate.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Setup rclone (seeed-storage OneDrive remote)
      if: steps.gate.outputs.skip != 'true'
      uses: ./.github/actions/setup-onedrive
      with:
        rclone_config: ${{ inputs.rclone_config }}

    - name: Read the mirror manifest
      # The page's data source, assembled for data.json:
      #   slots.json              {slot → tag} pointer file (promote flips
      #                          it; trees never move)
      #   trees/<tag>/manifest.json   immutable per-build
      #                          {relpath → share URL}, written once by
      #                          the build's release job — lives INSIDE the
      #                          tree, so one purge drops a tag's payload
      #                          and its index atomically
      # This step validates (signed manifests, non-empty images, sane
      # history) and writes data-core.json; the render step merges in
      # the release list and emits the single data.json the page
      # fetches. Absent or unreadable history trees/manifests are expired
      # downloads and are omitted; primary slots and invalid manifests
      # remain hard errors — deploying those anyway would strip good links
      # off a good page.
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      run: python3 .github/scripts/deploy-images-page.py manifest

    - name: Stage the page + data.json
      # The template is fully static — no substitutions. This step only
      # merges data-core.json (mirror state) with the release list into
      # the ONE data.json the page fetches; index.html is a verbatim
      # copy of the template. One bundled file = one fetch = every CDN
      # cache window internally consistent.
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PAGE_REPO: ${{ inputs.release_repo }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        [ -n "$PAGE_REPO" ] \
          || { echo "::error::PAGE_REPO empty"; exit 1; }

        [ -f data-core.json ] \
          || { echo "::error::missing mirror data-core.json — refusing to deploy an empty page"; exit 1; }

        # Fetch Releases at deploy time — the page itself makes zero runtime
        # API calls (60 req/hr/IP limit for unauthenticated clients). Every
        # referenced tag gets its own bounded lookup, then the list is paged;
        # an old stable outside the newest 30 Releases keeps its metadata.
        python3 .github/scripts/deploy-images-page.py data

        # The artifact root maps to the site root: files must land in
        # images/ so the URL stays .../<repo>/images/.
        mkdir -p site/images
        cp .github/assets/images-page.template.html site/images/index.html
        cp data.json site/images/data.json

        # Tripwires: the template must carry no placeholders, and the
        # page must actually load the data bundle.
        if grep -q '\$PAGE_' site/images/index.html; then
          echo "::error::template still holds \$PAGE_ placeholders"
          exit 1
        fi
        grep -q 'fetch("data.json"' site/images/index.html \
          || { echo "::error::page does not fetch data.json — template mismatch?"; exit 1; }
        python3 -c 'import json; d = json.load(open("site/images/data.json")); assert d["repo"] and "slots" in d and "manifests" in d and "releases" in d'
        echo "=== site/images: index.html $(wc -c < site/images/index.html) bytes + data.json $(wc -c < site/images/data.json) bytes ==="

    - name: Carry the live apt repository into the snapshot
      # The site hosts the apt repository at the root and this page at
      # images/; a Pages deployment replaces the whole site, so the
      # artifact must include both subtrees. apt-repo-publish mirrors
      # images/ the same way when it deploys.
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        site_base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
        python3 .github/scripts/fetch-apt-site.py "$site_base" site

    - name: Retire any earlier page artifact from this run
      # The retire-page deployment and the final page deployment can both
      # run in one workflow run; deploy-pages refuses to pick between two
      # artifacts named github-pages ("Artifact count is 2"), so drop the
      # earlier one before uploading ours.
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
          --jq '[.artifacts[] | select(.name == "github-pages") | .id] | join(" ")')"
        for id in $ids; do
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null \
            || { echo "::error::cannot delete the stale github-pages artifact $id"; exit 1; }
          echo "deleted the earlier github-pages artifact $id from this run"
        done

    - name: Upload the page artifact
      if: steps.gate.outputs.skip != 'true'
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - name: Deploy the images page
      # Waits for the deployment to finish and fails loudly on error —
      # the site can never silently keep serving stale content.
      if: steps.gate.outputs.skip != 'true'
      uses: actions/deploy-pages@v4
