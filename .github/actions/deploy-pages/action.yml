name: "Deploy images page"
description: "Bundle the mirror manifest into data.json, stage the static page, and deploy"

inputs:
  tag:
    description: "Release tag (used in commit message)"
    required: true
  repo:
    description: "Target repo for the page (owner/repo)"
    required: true
  release_repo:
    description: "Repo where the release lives (owner/repo)"
    required: true
  has_rclone:
    description: "Whether RCLONE_CONFIG is available (true/false)"
    required: true
  rclone_config:
    description: "RCLONE_CONFIG secret content"
    required: false
  pages_token:
    description: "PAGES_TARGET_TOKEN secret content (drives the gh-pages API push)"
    required: false
  gh_token:
    description: "GH_TOKEN for release/repo API calls (needs contents:read to list releases)"
    required: true

runs:
  using: "composite"
  steps:
    # The page ALWAYS lives on the build-source repo (owner/armbian-build
    # — the callers pass release_repo as the push target), pushed via the
    # gh-pages API with PAGES_TARGET_TOKEN. A same-repo actions-mode
    # deployment path used to exist but was unreachable by construction
    # (release_repo is an armbian-build repo, never this extension repo)
    # and was removed 2026-11-07.
    - name: Resolve deploy gate
      id: gate
      shell: bash
      env:
        TOK: ${{ inputs.pages_token }}
      run: |
        if [ -z "$TOK" ]; then
          echo "::notice::PAGES_TARGET_TOKEN is not set — images page push skipped."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "deploy: gh-pages API push to the build-source repo"
        fi

    - name: Checkout (page generator)
      if: steps.gate.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Setup rclone (seeed-storage OneDrive remote)
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      uses: ./.github/actions/setup-onedrive
      with:
        rclone_config: ${{ inputs.rclone_config }}

    - name: Read the mirror manifest
      # The page's data source, assembled for data.json:
      #   slots.json              {slot → tag} pointer file (promote flips
      #                          it; trees never move)
      #   trees/<tag>/manifest.json   immutable per-build
      #                          {relpath → share URL}, written once by
      #                          the build's release job — lives INSIDE
      #                          the tree, so one purge drops a tag's
      #                          payload and its index atomically
      # This step validates (signed manifests, non-empty images, sane
      # history) and writes data-core.json; the render step merges in
      # the release list and emits the single data.json the page
      # fetches. A manifest that won't fetch after one retry is a hard
      # error — deploying anyway would strip that slot's links off a
      # good page (same stance as the old "no share links at all"
      # refusal).
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, subprocess, sys, time

        # Namespaced per pipeline owner (fork and upstream each own
        # armbian/<owner>/images).
        IBASE = f"seeed-storage:armbian/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/images"

        def rcat(path, retries=1):
            r = None
            for attempt in range(retries + 1):
                r = subprocess.run(["rclone", "cat", path, "--contimeout", "15s"],
                                   capture_output=True, text=True)
                if r.returncode == 0:
                    return r.stdout
                if attempt < retries:
                    time.sleep(5)
            print(f"::error::rclone cat failed for {path}: {r.stderr.strip()}", file=sys.stderr)
            sys.exit(1)

        # The pointer file is the mirror's state: absent means it was
        # lost (hand-delete / accident) — refuse and point at the remedy.
        try:
            slots_in = json.loads(rcat(f"{IBASE}/slots.json"))
        except json.JSONDecodeError as e:
            print(f"::error::slots.json is not valid JSON ({e}) — fix by hand on OneDrive", file=sys.stderr)
            sys.exit(1)
        if not isinstance(slots_in, dict):
            print(f"::error::slots.json must be a JSON object, got {type(slots_in).__name__}", file=sys.stderr)
            sys.exit(1)

        manifests, page_slots = {}, {}

        def take(tag):
            try:
                m = json.loads(rcat(f"{IBASE}/trees/{tag}/manifest.json"))
            except json.JSONDecodeError as e:
                print(f"::error::trees/{tag}/manifest.json is not valid JSON ({e})", file=sys.stderr)
                sys.exit(1)
            if m.get("tag") != tag:
                print(f"::error::trees/{tag}/manifest.json is signed {m.get('tag')!r} — mismatch", file=sys.stderr)
                sys.exit(1)
            if not (m.get("images") or {}):
                print(f"::error::trees/{tag}/manifest.json has an empty images section — a referenced tree must carry files", file=sys.stderr)
                sys.exit(1)
            manifests[tag] = m

        # primary slots (scalar)
        for slot in ("pre-release", "stable"):
            tag = slots_in.get(slot)
            if not tag:
                continue    # absent/null → slot hidden, like an untagged slot dir
            take(tag)
            page_slots[slot] = tag

        # history array (older stables, newest-first). Tolerate a legacy
        # scalar "previous" key from a pre-history-array slots.json.
        hist = slots_in.get("history")
        if not isinstance(hist, list):
            hist = [slots_in["previous"]] if slots_in.get("previous") else []
        seen = set()
        for tag in hist:
            if not isinstance(tag, str) or not tag or tag in seen \
               or tag in (slots_in.get("stable"), slots_in.get("pre-release")):
                print(f"::error::slots.json history holds an invalid entry {tag!r} — fix by hand on OneDrive", file=sys.stderr)
                sys.exit(1)
            seen.add(tag)
            take(tag)
        if hist:
            page_slots["history"] = hist

        json.dump({"slots": page_slots, "manifests": manifests},
                  open("data-core.json", "w"))
        n_links = sum(len(m.get("images") or {}) + len(m.get("loaders") or {})
                      for m in manifests.values())
        print(f"manifest: {len(page_slots)} slot keys, history={len(hist)}, "
              f"{len(manifests)} manifests, {n_links} links total", file=sys.stderr)
        PY

    - name: Stage the page + data.json
      # The template is fully static — no substitutions. This step only
      # merges data-core.json (mirror state) with the release list into
      # the ONE data.json the page fetches; index.html is a verbatim
      # copy of the template. One bundled file = one fetch = every CDN
      # cache window internally consistent.
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PAGE_REPO: ${{ inputs.release_repo }}
        TAG: ${{ inputs.tag }}
        HAS_RCLONE: ${{ inputs.has_rclone }}
      run: |
        set -euo pipefail
        [ -n "$PAGE_REPO" ] \
          || { echo "::error::PAGE_REPO empty"; exit 1; }

        if [ "${HAS_RCLONE:-}" = "true" ] && [ -f data-core.json ]; then
          :   # data-core.json comes from the manifest step
        else
          echo '{"slots": {}, "manifests": {}}' > data-core.json
        fi

        # Fetch the release list at deploy time — the page itself makes
        # zero runtime API calls (60 req/hr/IP limit for unauthenticated
        # clients). The API throws occasional 504s (2026-11-03 refresh
        # run) — retry instead of killing an otherwise-good deploy.
        ok=""
        for attempt in 1 2 3; do
          if gh release list --repo "$PAGE_REPO" --limit 30 \
               --json tagName,isPrerelease,publishedAt > releases.raw; then
            ok=1
            break
          fi
          echo "gh release list failed (attempt $attempt/3), retrying in $((attempt * 10))s" >&2
          sleep $((attempt * 10))
        done
        [ -n "$ok" ] || { echo "::error::gh release list failed after 3 attempts"; exit 1; }
        jq '[.[] | {tag_name: .tagName, prerelease: .isPrerelease, published_at: .publishedAt}]' \
          < releases.raw > releases.json

        cp scripts/images-page.template.html images.html

        # Assemble via FILES, never command lines — the manifest map
        # blows past the kernel's 128 KiB per-argv limit (2026-11-02,
        # "Argument list too long").
        python3 - <<'PY'
        import json, os

        core = json.load(open("data-core.json"))
        releases = json.load(open("releases.json"))
        data = {
            "repo": os.environ["PAGE_REPO"],
            "slots": core["slots"],
            "manifests": core["manifests"],
            "releases": releases,
        }
        json.dump(data, open("data.json", "w"), separators=(",", ":"))
        print(f"data.json: repo={data['repo']} slots={list(data['slots'])} "
              f"{len(data['manifests'])} manifests, {len(releases)} releases")
        PY

        # Tripwires: the template must carry no placeholders, and the
        # page must actually load the data bundle.
        if grep -q '\$PAGE_' images.html; then
          echo "::error::template still holds \$PAGE_ placeholders"
          exit 1
        fi
        grep -q 'fetch("data.json"' images.html \
          || { echo "::error::page does not fetch data.json — template mismatch?"; exit 1; }
        python3 -c 'import json; d = json.load(open("data.json")); assert d["repo"] and "slots" in d and "manifests" in d and "releases" in d'
        echo "=== index.html $(wc -c < images.html) bytes + data.json $(wc -c < data.json) bytes ==="

    - name: Push to the target repo's gh-pages
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pages_token }}
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # data.json can reach hundreds of KB — pass the JSON body via
        # stdin, never the command line: a big payload blew the kernel's
        # 128 KiB per-arg limit and killed gh with "Argument list too
        # long" (exit 126) before any API call.
        python3 - "$REPO" "$TAG" <<'PYEOF'
        import base64, json, subprocess, sys

        repo, tag = sys.argv[1], sys.argv[2]

        def gh(*args, input=None):
            r = subprocess.run(["gh", "api", *args], input=input,
                               capture_output=True, text=True)
            if r.returncode != 0:
                print(f"::error::gh api {' '.join(args)} failed: {r.stderr.strip()}", file=sys.stderr)
                sys.exit(1)
            return r.stdout.strip()

        def put_blob(local, path):
            content = base64.b64encode(open(local, "rb").read()).decode()
            sha = gh("--method", "POST", f"repos/{repo}/git/blobs", "--input", "-",
                     "--jq", ".sha",
                     input=json.dumps({"content": content, "encoding": "base64"}))
            print(f"blob {path}: {sha}")
            return sha

        # Two files: the static shell + the data bundle it fetches.
        entries = [{"path": "images/index.html", "mode": "100644", "type": "blob",
                    "sha": put_blob("images.html", "images/index.html")},
                   {"path": "images/data.json", "mode": "100644", "type": "blob",
                    "sha": put_blob("data.json", "images/data.json")}]

        tree = gh("--method", "POST", f"repos/{repo}/git/trees", "--input", "-",
                  "--jq", ".sha",
                  input=json.dumps({"tree": entries}))
        print(f"tree: {tree}")

        # gh api prints the raw error body to stdout on failure, so a 404
        # (no gh-pages branch yet) leaves garbage in parent — validate the
        # shape instead of testing for emptiness.
        r = subprocess.run(["gh", "api", f"repos/{repo}/branches/gh-pages",
                            "--jq", ".commit.sha"],
                           capture_output=True, text=True)
        parent = r.stdout.strip() if r.returncode == 0 else ""
        import re
        if re.fullmatch(r"[0-9a-f]{40}", parent):
            body = {"message": f"pages: images {tag}", "tree": tree, "parents": [parent]}
            commit = gh("--method", "POST", f"repos/{repo}/git/commits", "--input", "-",
                        "--jq", ".sha", input=json.dumps(body))
            gh("--method", "PATCH", f"repos/{repo}/git/refs/heads/gh-pages",
               "--input", "-", "--jq", ".object.sha",
               input=json.dumps({"sha": commit}))
        else:
            body = {"message": f"pages: images {tag}", "tree": tree}
            commit = gh("--method", "POST", f"repos/{repo}/git/commits", "--input", "-",
                        "--jq", ".sha", input=json.dumps(body))
            gh("--method", "POST", f"repos/{repo}/git/refs",
               "--input", "-", "--jq", ".ref",
               input=json.dumps({"ref": "refs/heads/gh-pages", "sha": commit}))
        print(f"gh-pages commit pushed: {commit}")
        PYEOF

    - name: Trigger and verify the pages build
      # The legacy branch pipeline can wedge silently (seen 2026-11-02 on
      # a fork: POST /pages/builds returns "queued" and nothing runs).
      # Fail loudly instead of leaving the site on stale content.
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pages_token }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        # Assert by READING the config, not by writing it: the deploy token
        # has contents+pages-build rights but NOT pages-settings admin —
        # POST/PATCH /pages 404s (no perms), which made the old
        # write-to-assert emit a permanent warning on every run
        # (2026-11-03). GET is allowed; warn only on actual drift. The
        # build trigger below remains the hard gate for stale content.
        cur="$(gh api "repos/$REPO/pages" --jq '.source.branch + " " + .source.path' 2>/dev/null || echo '?')"
        [ "$cur" = "gh-pages /" ] \
          || echo "::warning::pages source is '$cur', expected 'gh-pages /' — fix in repo Settings → Pages"
        if ! gh api --method POST "repos/$REPO/pages/builds" >/dev/null 2>&1; then
          echo "::error::POST /pages/builds failed — the site would serve stale content"
          exit 1
        fi
        for _ in $(seq 1 18); do
          sleep 10
          st="$(gh api "repos/$REPO/pages/builds/latest" --jq '.status' 2>/dev/null || echo '?')"
          case "$st" in
            queued|in_progress|building)
              echo "pages build started: $st"; exit 0;;
          esac
        done
        echo "::error::no pages build started within 3 minutes — pipeline stuck? The site would serve stale content."
        exit 1
