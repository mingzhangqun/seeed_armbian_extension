name: "Deploy images page"
description: "Walk OneDrive for share links, render the images page, and deploy it"

inputs:
  tag:
    description: "Release tag (used in commit message)"
    required: true
  repo:
    description: "Target repo for the page (owner/repo)"
    required: true
  release_repo:
    description: "Repo where the release lives (owner/repo)"
    required: true
  has_rclone:
    description: "Whether RCLONE_CONFIG is available (true/false)"
    required: true
  rclone_config:
    description: "RCLONE_CONFIG secret content"
    required: false
  pages_token:
    description: "PAGES_TARGET_TOKEN secret content (cross-repo mode only)"
    required: false
  gh_token:
    description: "GH_TOKEN for release/repo API calls (needs contents:read to list releases)"
    required: true

runs:
  using: "composite"
  steps:
    # Same-repo deploys go through GitHub Actions page deployments
    # (upload-pages-artifact + deploy-pages) — observable as a workflow
    # run, no dependency on the legacy branch-build pipeline. Cross-repo
    # targets keep the gh-pages API push; those need PAGES_TARGET_TOKEN.
    - name: Resolve deploy mode
      id: gate
      shell: bash
      env:
        TOK: ${{ inputs.pages_token }}
        TARGET_REPO: ${{ inputs.repo }}
        CURRENT_REPO: ${{ github.repository }}
      run: |
        if [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
          echo "mode=actions" >> "$GITHUB_OUTPUT"
          echo "deploy mode: actions (same-repo workflow deployment)"
          exit 0
        fi
        if [ -z "$TOK" ]; then
          echo "::notice::PAGES_TARGET_TOKEN is not set — cross-repo images page push skipped."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "mode=api" >> "$GITHUB_OUTPUT"
          echo "deploy mode: api (cross-repo gh-pages push)"
        fi

    - name: Checkout (page generator)
      if: steps.gate.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Setup rclone (seeed-storage OneDrive remote)
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      uses: ./.github/actions/setup-onedrive
      with:
        rclone_config: ${{ inputs.rclone_config }}

    - name: List the mirror
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # One recursive listing covers the whole mirror — the slot-first
        # layout needs no board list, the page discovers boards from the
        # walk itself. Item IDs ride along: they survive the promote
        # rotation's server-side moves, which is what makes the share-link
        # cache in the next steps work.
        python3 - > tree.json <<'PY'
        import json, subprocess, sys

        base = "seeed-storage:armbian/images"
        r = subprocess.run(["rclone", "lsjson", "-R", "--files-only", base],
                           capture_output=True, text=True)
        if r.returncode != 0:
            # The mirror is unreachable. Rendering anyway would deploy a
            # page with LINKS={} and strip every link for no reason.
            print(f"::error::lsjson failed for {base}: {r.stderr.strip()}", file=sys.stderr)
            sys.exit(1)
        files = json.loads(r.stdout or "[]")

        # Slot-first layout: paths are "<slot>/<board>/<sub>/[ota/]<file>"
        # plus the per-slot identity files "<slot>/tag" — read for CONTENT
        # (the tag names the build the slot holds), never share-linked.
        # Files outside the three slot dirs (stale layouts, foreign trees)
        # are skipped: linking them wastes minutes per deploy and they
        # never render on the page anyway.
        SLOT_DIRS = ("pre-release", "stable", "previous")
        tag_slots, payload = [], []
        skipped = 0
        for it in files:
            p = it["Path"]
            parts = p.split("/")
            if len(parts) == 2 and parts[1] == "tag" and parts[0] in SLOT_DIRS:
                tag_slots.append(parts[0])
            elif parts[0] in SLOT_DIRS:
                payload.append({"path": p, "id": it.get("ID", "")})
            else:
                skipped += 1
        if skipped:
            print(f"::warning::{skipped} files sit outside the three slot dirs (stale layout on the mirror?) — not linked, not rendered", file=sys.stderr)

        slots = {}
        for slot in tag_slots:
            c = subprocess.run(["rclone", "cat", f"{base}/{slot}/tag"],
                               capture_output=True, text=True)
            if c.returncode == 0 and c.stdout.strip():
                slots[slot] = c.stdout.strip()
            else:
                print(f"::warning::could not read {slot}/tag — slot renders untagged", file=sys.stderr)

        print(json.dumps({"payload": payload, "slots": slots}))
        PY
        python3 - <<'PY'
        import json
        d = json.load(open("tree.json"))
        json.dump(d["slots"], open("slots.json", "w"))
        print(f"mirror: {len(d['payload'])} payload files, slot tags {d['slots']}")
        PY

    - name: Restore share-link cache
      # Links are cached by OneDrive item ID and survive rotations; see
      # the collect step. run_id in the key always saves a fresh entry,
      # restore-keys falls back to the newest older one.
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      uses: actions/cache/restore@v4
      with:
        path: linkcache
        key: onedrive-links-v1-${{ github.run_id }}
        restore-keys: |
          onedrive-links-v1-

    - name: Collect share links
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 - > links.json <<'PY'
        import json, os, subprocess, sys
        from concurrent.futures import ThreadPoolExecutor

        base = "seeed-storage:armbian/images"
        payload = json.load(open("tree.json"))["payload"]

        cached = {}
        try:
            cached = json.load(open("linkcache/links-by-id.json"))
        except FileNotFoundError:
            pass

        # Share links are keyed by the OneDrive item ID: IDs survive the
        # promote rotation (server-side moves), so a rotated slot is a
        # full cache hit and only genuinely new files pay the ~2-4 s
        # rclone link call (serial per-file linking blew a 10-minute job
        # on a full matrix). Bounded parallelism covers the misses.
        need = [e for e in payload if e["id"] and e["id"] not in cached]

        def make_link(e):
            lr = subprocess.run(["rclone", "link", "--timeout", "60s", f"{base}/{e['path']}"],
                                capture_output=True, text=True)
            ok = lr.returncode == 0
            return e["id"], ok, lr.stdout.strip() if ok else lr.stderr.strip()

        fresh, failures = {}, 0
        with ThreadPoolExecutor(max_workers=4) as ex:
            for i, (iid, ok, out) in enumerate(ex.map(make_link, need), 1):
                if ok:
                    fresh[iid] = out
                else:
                    failures += 1
                    print(f"::warning::link failed: {out}", file=sys.stderr)
                if i % 25 == 0:
                    print(f"  … {i}/{len(need)} links", file=sys.stderr)

        merged = {**cached, **fresh}
        # Template-facing map stays path → URL (schema unchanged).
        links = {e["path"]: merged[e["id"]] for e in payload
                 if e["id"] and e["id"] in merged}
        if payload and not links:
            # lsjson worked but no link could be had — systematic
            # (throttling/auth), not per-file noise. Deploying would strip
            # every link from the page.
            print(f"::error::no share links at all (cache empty, {failures}/{len(need)} fresh calls failed) — OneDrive throttled? Refusing to deploy a stripped page.", file=sys.stderr)
            sys.exit(1)
        for e in payload:
            if not e["id"] or e["id"] not in merged:
                print(f"::warning::no share link for {e['path']}", file=sys.stderr)

        # Re-cache, pruned to the ids on the mirror RIGHT NOW (drops
        # entries from slots that were rotated away or purged).
        live_ids = {e["id"] for e in payload if e["id"]}
        os.makedirs("linkcache", exist_ok=True)
        json.dump({k: v for k, v in merged.items() if k in live_ids},
                  open("linkcache/links-by-id.json", "w"))
        print(f"links: {len(links)}/{len(payload)} "
              f"({len(fresh)} freshly linked, {len(links) - len(fresh)} cached, {failures} failed)",
              file=sys.stderr)
        print(json.dumps(links))
        PY
        echo "links collected: $(python3 -c 'import json; print(len(json.load(open("links.json"))))')"

    - name: Save share-link cache
      # Cache key includes run_id so each run saves a fresh entry; restore-keys
      # falls back to the newest older one. Prune strategy: the cache is
      # keyed by OneDrive item ID and entries are pruned to live ids on each
      # collect step (see above), so the cache stays bounded by the current
      # mirror size. No time-based expiry — a stale cache entry is harmless
      # (just a miss on next walk).
      if: steps.gate.outputs.skip != 'true' && inputs.has_rclone == 'true'
      uses: actions/cache/save@v4
      with:
        path: linkcache
        key: onedrive-links-v1-${{ github.run_id }}

    - name: Render the page
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PAGE_REPO: ${{ inputs.release_repo }}
        TAG: ${{ inputs.tag }}
        HAS_RCLONE: ${{ inputs.has_rclone }}
      run: |
        set -euo pipefail
        [ -n "$PAGE_REPO" ] \
          || { echo "::error::PAGE_REPO empty"; exit 1; }

        if [ "${HAS_RCLONE:-}" = "true" ] && [ -f links.json ]; then
          :   # links.json/slots.json come from the walk step
        else
          echo '{}' > links.json
          echo '{}' > slots.json
        fi

        # Fetch release list at build time and embed it — eliminates the
        # runtime GitHub API call (60 req/hr/IP limit for unauthenticated
        # clients) and makes the page load instantly. The API throws
        # occasional 504s (2026-11-03 refresh run) — retry instead of
        # killing an otherwise-good deploy.
        ok=""
        for attempt in 1 2 3; do
          if gh release list --repo "$PAGE_REPO" --limit 30 \
               --json tagName,isPrerelease,publishedAt > releases.raw; then
            ok=1
            break
          fi
          echo "gh release list failed (attempt $attempt/3), retrying in $((attempt * 10))s" >&2
          sleep $((attempt * 10))
        done
        [ -n "$ok" ] || { echo "::error::gh release list failed after 3 attempts"; exit 1; }
        jq '[.[] | {tag_name: .tagName, prerelease: .isPrerelease, published_at: .publishedAt}]' \
          < releases.raw > releases.json

        # Substitute the placeholders from FILES, never environment
        # variables: the share-link map grows with the mirror and blew
        # past the kernel's 128 KiB per-argv/env-string limit, which made
        # every exec in this step (cat/gh/jq) fail with "Argument list
        # too long" (2026-11-02, 414-file walk).
        python3 - <<'PY'
        import json, os

        def load(p):
            try:
                return open(p).read().strip() or "{}"
            except FileNotFoundError:
                return "{}"

        vals = {
            "PAGE_REPO": os.environ["PAGE_REPO"],
            "PAGE_LINKS": load("links.json"),
            "PAGE_RELEASES": load("releases.json"),
            "PAGE_SLOTS": load("slots.json"),
        }
        for k, v in vals.items():
            if k != "PAGE_REPO":
                json.loads(v)  # each must be a valid JSON document

        html = open("scripts/images-page.template.html").read()
        for k, v in vals.items():
            html = html.replace("$" + k, v)
        leftover = [k for k in vals if ("$" + k) in html]
        if leftover:
            raise SystemExit(f"::error::placeholders not substituted: {leftover}")
        open("images.html", "w").write(html)
        PY
        grep -q "const CFG = Object.freeze({ repo: \"$PAGE_REPO\" });" images.html \
          || { echo "::error::repo not baked into the page"; exit 1; }
        # LINKS/SLOTS must bake into syntactically valid JS object literals —
        # catches stray stdout polluting links.json/slots.json upstream.
        grep -qE '^const LINKS = \{.*\};$' images.html \
          || { echo "::error::LINKS did not render as a JSON object — links.json is malformed?"; exit 1; }
        grep -qE '^const SLOTS = \{.*\};$' images.html \
          || { echo "::error::SLOTS did not render as a JSON object — slots.json is malformed?"; exit 1; }
        echo "=== page $(wc -c < images.html) bytes ==="

    # ── actions mode: deploy through the run's Pages deployment ──

    - name: Clear stale github-pages artifacts (actions mode)
      # deploy-pages@v4 refuses when the run already holds a github-pages
      # artifact — and a run CAN legitimately deploy twice (build-images:
      # post-purge sync + post-release deploy). Drop this run's earlier
      # artifact before uploading a fresh one.
      if: steps.gate.outputs.mode == 'actions'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        gh api "repos/$REPO/actions/artifacts?per_page=100" > artifacts.json
        ids="$(python3 -c '
        import json, os
        arts = json.load(open("artifacts.json")).get("artifacts", [])
        run_id = int(os.environ["RUN_ID"])
        print("\n".join(str(a["id"]) for a in arts
                        if a["name"] == "github-pages"
                        and (a.get("workflow_run") or {}).get("id") == run_id))')"
        for id in $ids; do
          gh api -X DELETE "repos/$REPO/actions/artifacts/$id" \
            && echo "deleted stale github-pages artifact $id"
        done

    - name: Stage the site (actions mode)
      if: steps.gate.outputs.mode == 'actions'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p site/images
        cp images.html site/images/index.html
        echo "staged images/index.html ($(wc -c < images.html) bytes)"

    - name: Upload pages artifact (actions mode)
      if: steps.gate.outputs.mode == 'actions'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy the site (actions mode)
      if: steps.gate.outputs.mode == 'actions'
      uses: actions/deploy-pages@v4

    # ── api mode: push a gh-pages commit to the target repo ──

    - name: Push to the target repo's gh-pages (api mode)
      if: steps.gate.outputs.mode == 'api'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pages_token }}
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # images.html embeds the full link map (hundreds of KB) — pass the
        # JSON body via stdin, never the command line: a big page blew the
        # kernel's 128 KiB per-arg limit and killed gh with "Argument list
        # too long" (exit 126) before any API call.
        python3 - "$REPO" "$TAG" <<'PYEOF'
        import base64, json, subprocess, sys

        repo, tag = sys.argv[1], sys.argv[2]

        def gh(*args, input=None):
            r = subprocess.run(["gh", "api", *args], input=input,
                               capture_output=True, text=True)
            if r.returncode != 0:
                print(f"::error::gh api {' '.join(args)} failed: {r.stderr.strip()}", file=sys.stderr)
                sys.exit(1)
            return r.stdout.strip()

        html = base64.b64encode(open("images.html", "rb").read()).decode()
        blob = gh("--method", "POST", f"repos/{repo}/git/blobs", "--input", "-",
                  "--jq", ".sha",
                  input=json.dumps({"content": html, "encoding": "base64"}))
        print(f"blob: {blob}")

        tree = gh("--method", "POST", f"repos/{repo}/git/trees", "--input", "-",
                  "--jq", ".sha",
                  input=json.dumps({"tree": [{"path": "images/index.html", "mode": "100644",
                                               "type": "blob", "sha": blob}]}))
        print(f"tree: {tree}")

        # gh api prints the raw error body to stdout on failure, so a 404
        # (no gh-pages branch yet) leaves garbage in parent — validate the
        # shape instead of testing for emptiness.
        r = subprocess.run(["gh", "api", f"repos/{repo}/branches/gh-pages",
                            "--jq", ".commit.sha"],
                           capture_output=True, text=True)
        parent = r.stdout.strip() if r.returncode == 0 else ""
        import re
        if re.fullmatch(r"[0-9a-f]{40}", parent):
            body = {"message": f"pages: images {tag}", "tree": tree, "parents": [parent]}
            commit = gh("--method", "POST", f"repos/{repo}/git/commits", "--input", "-",
                        "--jq", ".sha", input=json.dumps(body))
            gh("--method", "PATCH", f"repos/{repo}/git/refs/heads/gh-pages",
               "--input", "-", "--jq", ".object.sha",
               input=json.dumps({"sha": commit}))
        else:
            body = {"message": f"pages: images {tag}", "tree": tree}
            commit = gh("--method", "POST", f"repos/{repo}/git/commits", "--input", "-",
                        "--jq", ".sha", input=json.dumps(body))
            gh("--method", "POST", f"repos/{repo}/git/refs",
               "--input", "-", "--jq", ".ref",
               input=json.dumps({"ref": "refs/heads/gh-pages", "sha": commit}))
        print(f"gh-pages commit pushed: {commit}")
        PYEOF

    - name: Trigger and verify the pages build (api mode)
      # The legacy branch pipeline can wedge silently (seen 2026-11-02 on
      # a fork: POST /pages/builds returns "queued" and nothing runs).
      # Fail loudly instead of leaving the site on stale content.
      if: steps.gate.outputs.mode == 'api'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pages_token }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        # Assert by READING the config, not by writing it: the deploy token
        # has contents+pages-build rights but NOT pages-settings admin —
        # POST/PATCH /pages 404s (no perms), which made the old
        # write-to-assert emit a permanent warning on every run
        # (2026-11-03). GET is allowed; warn only on actual drift. The
        # build trigger below remains the hard gate for stale content.
        cur="$(gh api "repos/$REPO/pages" --jq '.source.branch + " " + .source.path' 2>/dev/null || echo '?')"
        [ "$cur" = "gh-pages /" ] \
          || echo "::warning::pages source is '$cur', expected 'gh-pages /' — fix in repo Settings → Pages"
        if ! gh api --method POST "repos/$REPO/pages/builds" >/dev/null 2>&1; then
          echo "::error::POST /pages/builds failed — the site would serve stale content"
          exit 1
        fi
        for _ in $(seq 1 18); do
          sleep 10
          st="$(gh api "repos/$REPO/pages/builds/latest" --jq '.status' 2>/dev/null || echo '?')"
          case "$st" in
            queued|in_progress|building)
              echo "pages build started: $st"; exit 0;;
          esac
        done
        echo "::error::no pages build started within 3 minutes — pipeline stuck? The site would serve stale content."
        exit 1
