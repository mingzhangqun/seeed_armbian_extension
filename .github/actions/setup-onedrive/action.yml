name: setup-onedrive
description: >
  Install rclone + configure the seeed-storage OneDrive remote. Single
  place to bump the pinned rclone version for every job that touches
  OneDrive. Files land under armbian/images/<board>/<slot>/<profile>[-secure-boot]/.

inputs:
  rclone_config:
    description: rclone.conf contents (raw or base64) — pass the RCLONE_CONFIG secret
    required: true

runs:
  using: composite
  steps:
    - name: Install rclone + seeed-storage remote
      uses: AnimMouse/setup-rclone@v1
      with:
        version: v1.67.0
        rclone_config: ${{ inputs.rclone_config }}
        disable_base64: true
