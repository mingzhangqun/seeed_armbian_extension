<!DOCTYPE html>
<!--
  PROTOTYPE — three-slot images page (latest / pre-release / previous).

  Same skeleton as scripts/images-page.template.html, plus:
    * boot() reads the /releases LIST (not /releases/latest) and derives
      three slots: newest full release = latest, second full = previous,
      newest prerelease = pre-release (hidden when older than latest)
    * latest stays the always-expanded main table; previous and
      pre-release render as collapsed <details> slots below it
    * board name ABOVE the photo, large
    * downloads: Recovery box always, A/B box to its right when present
    * EVERY download button is a OneDrive link derived client-side from
      the folder share link (shares/u!<b64>/root:/<slot path>/file:/content)
      into armbian-images/<board>/<slot>/ — GitHub is only the data
      source for names/sizes
  Demo harness: window.MOCK_RELEASES replaces the fetch; open the page
  with #open to expand the pre-release slot for preview purposes.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeed reComputer — Armbian 镜像下载</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.65 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
         background: #f3f5f8; color: #03353f; }
  header { background: #03353f; color: #fff; padding: 34px 0 30px; }
  main { max-width: 920px; margin: 0 auto; padding: 0 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .5px; }
  h1 em { color: #8dc215; font-style: normal; }
  .tag { display: inline-block; background: rgba(141,194,21,.18); color: #8dc215;
         border: 1px solid rgba(141,194,21,.55); border-radius: 6px; padding: 0 8px;
         font: 12px/1.7 ui-monospace, "SF Mono", monospace; text-decoration: none; }
  a.tag:hover { color: #03353f; border-color: #03353f; }
  .board { display: flex; gap: 26px; background: #fff; border-radius: 14px;
           padding: 24px; margin: 22px 0; box-shadow: 0 1px 4px rgba(3,53,63,.08); }
  .photo { flex: 0 0 300px; }
  .photo img { width: 100%; border-radius: 10px; background: #fff; mix-blend-mode: multiply; }
  .photo.noimg { flex-basis: auto; max-width: 300px; }
  .photo.noimg img { display: none; }
  .caption { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .caption span { color: #8dc215; }
  .info { flex: 1; min-width: 0; }
  /* OTA-mode boxes: Recovery always; A/B box beside it (right) when it
     exists. Side by side on wide cards, stacked when narrow. */
  .modeboxes { display: flex; gap: 14px; align-items: stretch; }
  .modebox { flex: 1 1 0; min-width: 0; border: 1px solid #e3eaf0; border-radius: 10px; padding: 0 14px 6px; }
  .modebox h3 { font-size: 13px; font-weight: 600; color: #51707c; margin: 10px 0 0; letter-spacing: .3px; }
  .row { display: flex; flex-direction: column; gap: 7px; padding: 9px 0;
         border-top: 1px solid #eef2f6; }
  .row-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .row-title { font-weight: 700; font-size: 14px; }
  .row-meta { color: #7b8fa0; font-size: 12.5px; }
  .row-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 6px;
           vertical-align: 2px; }
  .badge.ab { background: rgba(255,188,68,.18); color: #b96e00; border: 1px solid rgba(255,188,68,.6); }
  .badge.crypt { background: rgba(3,53,63,.08); color: #03353f; border: 1px solid rgba(3,53,63,.25); }
  .btn { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px;
         text-decoration: none; color: #03353f; border: 1px solid #d7dee5; background: #fff; }
  .btn.primary { background: #8dc215; border-color: #8dc215; color: #fff; font-weight: 600; }
  .btn:hover { filter: brightness(.96); }
  .loading { color: #7b8fa0; padding: 30px 0; }
  .fallback { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
              background: #fff; border: 1px solid #ffd9a0; border-radius: 14px;
              padding: 18px 24px; margin: 22px 0; font-size: 14px; }
  .fallback[hidden] { display: none; }

  /* ── slot (<details>) blocks: previous / pre-release ── */
  details.slot { background: #fff; border-radius: 14px; margin: 22px 0;
                 box-shadow: 0 1px 4px rgba(3,53,63,.08); overflow: hidden; }
  details.slot > summary { display: flex; align-items: center; gap: 12px;
                           padding: 15px 24px; cursor: pointer; list-style: none;
                           user-select: none; font-size: 14px; }
  details.slot > summary::-webkit-details-marker { display: none; }
  details.slot > summary:hover { background: #fafbfd; }
  details.slot[open] > summary { border-bottom: 1px solid #eef2f6; }
  .badge.slotlatest { background: rgba(141,194,21,.15); color: #5a7d0a;
                      border: 1px solid rgba(141,194,21,.55); font-size: 12px;
                      border-radius: 6px; padding: 1px 9px; vertical-align: 0; }
  .badge.slotpre { background: rgba(255,188,68,.18); color: #b96e00;
                   border: 1px solid rgba(255,188,68,.6); font-size: 12px;
                   border-radius: 6px; padding: 1px 9px; vertical-align: 0; }
  .badge.slotprev { background: rgba(3,53,63,.06); color: #51707c;
                    border: 1px solid rgba(3,53,63,.22); font-size: 12px;
                    border-radius: 6px; padding: 1px 9px; vertical-align: 0; }
  .slotdate { color: #7b8fa0; font-size: 13px; }
  .chev { margin-left: auto; color: #7b8fa0; transition: transform .15s; }
  details.slot[open] .chev { transform: rotate(90deg); }
  .slot-body { padding: 2px 24px 10px; }
  .slot-body .board { margin: 16px 0 8px; }
  .slot-note { color: #7b8fa0; font-size: 13px; padding: 12px 2px 0; }

  footer { margin: 40px 0 60px; color: #7b8fa0; font-size: 13px; line-height: 2; }
  footer code { background: #e8edf2; padding: 1px 7px; border-radius: 4px; font-size: 12px; }
  @media (max-width: 720px) { .board { flex-direction: column; } .photo { flex: none; } .modeboxes { flex-direction: column; } }
</style>
</head>
<body>
<header><main>
  <h1>Seeed <em>reComputer</em> — Armbian 镜像</h1>
</main></header>
<main>
  <div id="boards" class="loading">正在从 GitHub 获取最新版本…</div>
  <div id="slots"></div>

  <div id="fallback" class="fallback" hidden>
    <span>⚠ 实时获取最新版信息失败或暂无正式版。可以从这里直接下载：</span>
    <a class="btn primary" href="https://github.com/Seeed-Studio/seeed_armbian_extension/releases/latest">GitHub Releases</a>
    <a class="btn primary" href="https://1drv.ms/f/c/demo">☁ OneDrive 下载全部</a>
  </div>
  <noscript>
    <div class="fallback">
      <span>本页需要 JavaScript 从 GitHub 实时获取最新版本，也可直接下载：</span>
      <a class="btn primary" href="https://github.com/Seeed-Studio/seeed_armbian_extension/releases/latest">GitHub Releases</a>
      <a class="btn primary" href="https://1drv.ms/f/c/demo">☁ OneDrive 下载全部</a>
    </div>
  </noscript>

  <footer>
    写入 eMMC/SD：<code>xz -d -T0 xxx.img.xz</code> 后用 <code>dd</code> 或 balenaEtcher 烧写。
  </footer>
</main>

<script>
"use strict";
/* ── demo data (shipping version fetches /releases instead) ──────────── */
(function () {
  function A(name, size) {
    return { name: name, size: size,
             browser_download_url: "https://github.com/Seeed-Studio/seeed_armbian_extension/releases/download/TAG/" + name };
  }
  // one board's asset set: cli (trixie minimal) + desktop (resolute gnome);
  // names follow the REAL grammar: Armbian-unofficial_<ver>_Recomputer-<board>_<codename>_vendor_<kernel>_<variant>
  function set(board, ver, kernel, extra) {
    var cli = "Armbian-unofficial_" + ver + "_Recomputer-" + board + "_trixie_vendor_" + kernel + "_minimal";
    var dt  = "Armbian-unofficial_" + ver + "_Recomputer-" + board + "_resolute_vendor_" + kernel + "_gnome_desktop";
    var a = [
      A(cli + ".img.xz", 673185792), A(cli + ".img.xz.sha256", 151),
      A(cli + "_OTA.tar.gz", 92301312), A(cli + "_OTA.checksums", 312),
      A(cli + ".img.txt", 3412),
      A(dt + ".img.xz", 1932735283), A(dt + ".img.xz.sha256", 151),
      A(dt + "_OTA.tar.gz", 126484480), A(dt + "_OTA.checksums", 312),
      A(dt + ".img.txt", 3388)
    ];
    if (extra) a = a.concat(extra(board, ver, kernel));
    return a;
  }
  var boards = ["rk3576-devkit", "rk3576-module-devkit", "rk3576-industrial", "rk3588-devkit"];
  function many(trunk, kernel, extra) {
    var all = [];
    boards.forEach(function (b) { all = all.concat(set(b, trunk, kernel, extra)); });
    return all;
  }
  window.MOCK_RELEASES = [
    { tag_name: "261031-0800", prerelease: true,
      published_at: "2026-10-31T08:41:55Z", created_at: "2026-10-31T08:41:55Z",
      assets: many("26.11.0-trunk", "6.1.172", function (board, ver, kernel) {
        // ota_ab dispatched ON for this build → every board gets A/B rows
        var ab = "Armbian-unofficial_" + ver + "_Recomputer-" + board + "_trixie_vendor_" + kernel + "_minimal_AB_PART";
        var abd = "Armbian-unofficial_" + ver + "_Recomputer-" + board + "_resolute_vendor_" + kernel + "_gnome_desktop_AB_PART";
        var out = [
          A(ab + ".img.xz", 688914432), A(ab + ".img.xz.sha256", 151),
          A(ab + "_OTA.tar.gz", 95312000), A(ab + "_OTA.checksums", 312),
          A(abd + ".img.xz", 1997159424), A(abd + ".img.xz.sha256", 151)
        ];
        if (board === "rk3576-industrial") {
          var cr = "Armbian-unofficial_" + ver + "_Recomputer-" + board + "_resolute_vendor_" + kernel + "_gnome_desktop-crypt";
          out.push(A(cr + ".img.xz", 1946994688), A(cr + ".img.xz.sha256", 151));
        }
        return out;
      }) },
    { tag_name: "261028-0900", prerelease: false,
      published_at: "2026-10-28T09:14:41Z", created_at: "2026-10-28T09:14:41Z",
      assets: many("26.10.0-trunk", "6.1.157") },
    { tag_name: "261014-1300", prerelease: false,
      published_at: "2026-10-14T13:22:08Z", created_at: "2026-10-14T13:22:08Z",
      assets: many("26.9.0-trunk", "6.1.143") }
  ];
})();

/* ── below: the shipping page logic (filename grammar unchanged) ────── */
const CFG = Object.freeze({ repo: "Seeed-Studio/seeed_armbian_extension",
                            onedrive: "https://1drv.ms/f/c/demo" });

// Every download button is a OneDrive link, derived client-side from the
// folder share link: the share id is u!<base64url(share URL)> and a file
// is addressed as shares/<id>/root:/<path>/<file>:/content — no server
// or per-file link manifest needed.
function shareRoot(url) {
  const b64 = btoa(unescape(encodeURIComponent(url)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "https://api.onedrive.com/v1.0/shares/u!" + b64 + "/root:";
}
const OD_ROOT = shareRoot(CFG.onedrive);
function odUrl(board, slot, name) {
  return OD_ROOT + "/armbian-images/" + board + "/" + slot + "/" + name + ":/content";
}

const BOARD_PAT = /Recomputer-([A-Za-z0-9][A-Za-z0-9-]*?)_/;
const VER_PAT = /^Armbian[^_]*_([^_]+)/;               // Armbian[-unofficial]_26.11.0-trunk_…
const REL_PAT = /_([a-z]+)_vendor_([0-9][\w.-]*?)_/;   // …_resolute_vendor_6.1.172_…
const VARIANT_TITLE = { cli: "CLI", desktop: "Desktop" };
const ROW_LABEL = { img: "镜像", ota: "OTA",
                    sha256: "sha256", sha: "sha256", chk: "sha256", txt: "构建信息" };
// pair each artifact with its checksum: 镜像|sha256  OTA|sha256  构建信息
const KIND_ORDER = ["img", "sha256", "sha", "ota", "chk", "txt"];

function parse(name, size, url) {
  const m = name.match(BOARD_PAT);
  if (!m) return null;
  const board = m[1];
  const variant = name.indexOf("_gnome_desktop") >= 0 ? "desktop"
                : name.indexOf("_minimal") >= 0 ? "cli" : null;
  if (!variant) return null;
  const mode = name.indexOf("_AB_PART") >= 0 ? "ab" : "recovery";
  const crypt = name.indexOf("-crypt") >= 0;
  let kind = null;
  if (name.endsWith(".img.xz.sha256")) kind = "sha256";
  else if (name.endsWith(".img.xz")) kind = "img";
  else if (name.endsWith(".img.sha")) kind = "sha";
  else if (name.endsWith(".img.txt")) kind = "txt";
  else if (name.endsWith("_OTA.tar.gz")) kind = "ota";
  else if (name.endsWith("_OTA.checksums")) kind = "chk";
  else if (name.endsWith(".sha256")) kind = "sha256";
  if (!kind) return null;
  // version metadata, extracted from the self-describing filename:
  // version "26.11.0-trunk" → "26.11.0"; release codename + kernel
  const vm = name.match(VER_PAT);
  const rm = name.match(REL_PAT);
  return { board: board, variant: variant, mode: mode, crypt: crypt,
           kind: kind, name: name, size: size, url: url,
           ver: vm ? vm[1].replace(/-.*$/, "") : "",
           release: rm ? rm[1] : "",
           kernel: rm ? rm[2] : "" };
}

function boardImage(board) {
  return "https://armbian.com/api/v1/images/boards/480/recomputer-"
       + board.replace("-dev-kit", "-devkit") + ".png";
}

function group(assets) {
  const map = new Map();
  for (const a of assets || []) {
    const r = parse(a.name, a.size, a.browser_download_url);
    if (!r) continue;
    const key = [r.board, r.variant, r.mode, r.crypt].join("\t");
    if (!map.has(key))
      map.set(key, { board: r.board, variant: r.variant, mode: r.mode,
                     crypt: r.crypt, ver: r.ver, release: r.release,
                     kernel: r.kernel, d: {} });
    map.get(key).d[r.kind] = { name: r.name, size: a.size, url: a.browser_download_url };
  }
  const rank = e => (e.variant === "cli" ? 0 : 4)
                  + (e.mode === "recovery" ? 0 : 2) + (e.crypt ? 1 : 0);
  return [...map.values()].sort((x, y) =>
    x.board < y.board ? -1 : x.board > y.board ? 1 : rank(x) - rank(y));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildRow(entry, suppressAb, slot) {
  // head: bold variant + gray " - codename - armbian version - kernel" meta
  const head = el("div", "row-head");
  const title = el("span", "row-title", VARIANT_TITLE[entry.variant]);
  // inside an A/B modebox the box title already says it — badge off
  if (entry.mode === "ab" && !suppressAb) title.appendChild(el("span", "badge ab", "A/B"));
  if (entry.crypt) title.appendChild(el("span", "badge crypt", "加密"));
  const meta = [entry.release, entry.ver, entry.kernel].filter(Boolean).join(" - ");
  if (meta) head.appendChild(el("span", "row-meta", "- " + meta));
  head.prepend(title);

  // links: 镜像|sha256  OTA|sha256  构建信息 — no sizes
  const links = el("div", "row-links");
  for (const kind of KIND_ORDER) {
    const v = entry.d[kind];
    if (!v) continue;
    const primary = kind === "img" || kind === "ota";
    const a = el("a", primary ? "btn primary" : "btn", ROW_LABEL[kind]);
    a.href = odUrl(entry.board, slot, v.name);
    links.appendChild(a);
  }

  const row = el("div", "row");
  row.append(head, links);
  return row;
}

function buildModeBox(title, entries, suppressAb, slot) {
  const box = el("div", "modebox");
  box.appendChild(el("h3", null, title));
  for (const entry of entries) box.appendChild(buildRow(entry, suppressAb, slot));
  return box;
}

function buildSection(board, entries, slot) {
  const sec = el("section", "board");

  // photo column: board name ABOVE the photo, large
  const photo = el("div", "photo");
  const cap = el("div", "caption", "reComputer ");
  cap.appendChild(el("span", null, board));
  photo.appendChild(cap);
  const img = document.createElement("img");
  img.src = boardImage(board);
  img.alt = "reComputer " + board;
  img.loading = "lazy";
  img.onerror = () => photo.classList.add("noimg");
  photo.appendChild(img);

  // downloads: Recovery box always; A/B box beside it when assets exist.
  // Every button links straight into the board's OneDrive slot dir.
  const rec = entries.filter(e => e.mode !== "ab");
  const ab = entries.filter(e => e.mode === "ab");
  const boxes = el("div", "modeboxes");
  boxes.appendChild(buildModeBox("Recovery 恢复升级", rec, false, slot));
  if (ab.length) boxes.appendChild(buildModeBox("A/B 双分区", ab, true, slot));

  const info = el("div", "info");
  info.append(boxes);

  sec.append(photo, info);
  return sec;
}

function fmtDate(iso) {
  return iso ? iso.slice(0, 10) + " " + iso.slice(11, 16) + " UTC" : "";
}

/* ── slot derivation: /releases list → latest / previous / pre ──────── */
function slotsFrom(list) {
  const fulls = [], pres = [];
  for (const r of list || []) (r.prerelease ? pres : fulls).push(r);
  const latest = fulls[0] || null;      // list is newest-first
  const previous = fulls[1] || null;
  let pre = pres[0] || null;
  // tags are YYMMDD-HHMM → lexicographic compare = chronological.
  // A prerelease older than latest means "already promoted" → hide it.
  if (pre && latest && String(pre.tag_name) <= String(latest.tag_name)) pre = null;
  return { latest: latest, previous: previous, pre: pre };
}

function splitBoards(rel) {
  const sections = new Map();
  for (const e of group(rel.assets)) {
    if (!sections.has(e.board)) sections.set(e.board, []);
    sections.get(e.board).push(e);
  }
  return sections;
}

function buildSlot(rel, kind) {  // kind: "latest" | "pre" | "prev"
  const det = document.createElement("details");
  det.className = "slot";
  det.id = "slot-" + kind;
  det.open = kind === "latest";  // latest starts expanded; others collapsed

  const look = {
    latest: ["badge slotlatest", "✅ 正式版"],
    pre:    ["badge slotpre",    "🧪 预览版（未转正）"],
    prev:   ["badge slotprev",   "⏱ 上一版本"]
  }[kind];
  const sum = el("summary");
  sum.appendChild(el("span", look[0], look[1]));
  // tag links to the release page on GitHub; interactive elements inside
  // <summary> follow their activation without toggling the details
  const tag = el("a", "tag", rel.tag_name);
  tag.href = "https://github.com/" + CFG.repo + "/releases/tag/" + rel.tag_name;
  tag.title = "GitHub release";
  sum.appendChild(tag);
  sum.appendChild(el("span", "slotdate", fmtDate(rel.published_at)));
  sum.appendChild(el("span", "chev", "▸"));

  const body = el("div", "slot-body");
  if (kind === "pre")
    body.appendChild(el("div", "slot-note",
      "本轮构建已完整落地（全部板卡通过），待上机验证后转正为正式版。"));
  const slotDir = kind === "latest" ? "latest"
                : kind === "pre" ? "pre-release" : "previous";
  for (const [b, es] of splitBoards(rel))
    body.appendChild(buildSection(b, es, slotDir));

  det.append(sum, body);
  return det;
}

async function boot() {
  const boards = document.getElementById("boards");
  const fallback = document.getElementById("fallback");
  let list;
  try {
    if (window.MOCK_RELEASES) {
      list = window.MOCK_RELEASES;
    } else {
      const r = await fetch("https://api.github.com/repos/" + CFG.repo + "/releases?per_page=30",
                            { headers: { Accept: "application/vnd.github+json" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      list = await r.json();
    }
  } catch (e) {
    boards.hidden = true; fallback.hidden = false;
    return;
  }
  const s = slotsFrom(list);
  if (!s.latest) {
    boards.hidden = true; fallback.hidden = false;
    return;
  }
  boards.hidden = true;  // all three slots render as collapsible bars below

  const slots = document.getElementById("slots");
  slots.replaceChildren(buildSlot(s.latest, "latest"));
  if (s.pre) slots.appendChild(buildSlot(s.pre, "pre"));
  if (s.previous) slots.appendChild(buildSlot(s.previous, "prev"));

  // demo hook: #open expands the pre-release slot for previewing
  if (location.hash === "#open") {
    const d = document.getElementById("slot-pre");
    if (d) d.open = true;
  }
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
