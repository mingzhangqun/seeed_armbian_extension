<!DOCTYPE html>
<!--
  Images download page — static template.

  Rendered by the images-page jobs (build/test/promote/refresh) by the
  deploy-pages action's renderer; the substitutions are $PAGE_REPO,
  $PAGE_LINKS, $PAGE_RELEASES and $PAGE_SLOTS, fed from files (the
  share-link map outgrew the kernel's env-var size limit). The inline JS
  deliberately uses no backtick template literals — plain $NAME
  substitution only, so keep avoiding ${...} sequences. Keep it that way.

  Data flow (all client-side at browse time):
    * slot binding: SLOTS — the mirror's per-slot <slot>/tag files, read
      at render time — names the build each slot holds (latest/,
      previous/, pre-release/). A slot without a tag file stays hidden,
      so after promotion the pre slot vanishes (rotated away) with no
      tag-ordering heuristic.
    * RELEASES (list fetched at render time) joins in per-tag metadata
      (publish date, GitHub link); release-list inference is only the
      fallback when no mirror tags exist (fork mode: SLOTS={}).
    * each slot's file list comes from LINKS — every file under
      <slot>/<board>/<sub>/[/ota/] on the OneDrive mirror with its
      share link; boards are discovered from the walk itself
  Layout: three collapsible slot bars (Stable expanded by default),
  pill anchor nav under the title, per-board cards (name above photo),
  downloads grouped mode × secure into stacked boxes, buttons grouped
  [Image sha256] | [OTA checksum] | [Build info].
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Seeed reComputer — Armbian Image Downloads</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.65 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
         background: #f3f5f8; color: #03353f; }
  header { background: #03353f; color: #fff; padding: 34px 0 30px; }
  main { max-width: 920px; margin: 0 auto; padding: 0 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .5px; }
  h1 em { color: #8dc215; font-style: normal; }
  /* anchor nav under the title: pill links color-matched to their slot
     badges (green Stable / amber Pre-release / gray Previous) */
  .slotnav { display: flex; gap: 12px; margin-top: 12px; font-size: 13px; }
  .slotnav[hidden] { display: none; }
  .slotnav a { display: inline-block; padding: 2px 14px; border-radius: 999px;
               text-decoration: none; border: 1px solid; }
  .slotnav a.latest { color: #8dc215; border-color: rgba(141,194,21,.55);
                      background: rgba(141,194,21,.12); }
  .slotnav a.pre { color: #ffbc44; border-color: rgba(255,188,68,.55);
                   background: rgba(255,188,68,.12); }
  .slotnav a.prev { color: #b9cdd4; border-color: rgba(185,205,212,.45);
                    background: rgba(185,205,212,.08); }
  .slotnav a:hover { filter: brightness(1.18); }
  details.slot { scroll-margin-top: 12px; }
  .tag { display: inline-block; background: rgba(141,194,21,.18); color: #8dc215;
         border: 1px solid rgba(141,194,21,.55); border-radius: 6px; padding: 0 8px;
         font: 12px/1.7 ui-monospace, "SF Mono", monospace; text-decoration: none; }
  a.tag:hover { color: #03353f; border-color: #03353f; }
  .board { display: flex; gap: 26px; background: #fff; border-radius: 14px;
           padding: 24px; margin: 22px 0; box-shadow: 0 1px 4px rgba(3,53,63,.08); }
  .photo { flex: 0 0 300px; }
  .photo img { width: 100%; border-radius: 10px; background: #fff; mix-blend-mode: multiply; }
  .photo.noimg { flex-basis: auto; max-width: 300px; }
  .photo.noimg img { display: none; }
  .caption { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .caption span { color: #8dc215; }
  .info { flex: 1; min-width: 0; }
  /* OTA-mode boxes: Recovery (single partition) with the A/B box (dual
     partition) below it, then their Secure counterparts. */
  .modeboxes { display: flex; flex-direction: column; gap: 14px; }
  .modebox { border: 1px solid #e3eaf0; border-radius: 10px; padding: 0 14px 6px; }
  .modebox h3 { font-size: 13px; font-weight: 600; color: #51707c; margin: 10px 0 0; letter-spacing: .3px; }
  .boxsub { color: #9db0ba; font-weight: 400; font-size: 12px; }
  .row { display: flex; flex-direction: column; gap: 7px; padding: 9px 0;
         border-top: 1px solid #eef2f6; }
  .row-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .row-title { font-weight: 700; font-size: 14px; }
  .row-meta { color: #7b8fa0; font-size: 12.5px; }
  .row-info { color: #2c6fbf; font-size: 12.5px; text-decoration: underline;
              text-decoration-style: dotted; margin-left: 8px; }
  .row-info:hover { color: #1a4d8f; }
  .row-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  /* button groups separated by a vertical rule:
     [Image sha256] | [OTA checksum] */
  .grp { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .grp + .grp { margin-left: 28px; padding-left: 30px; border-left: 1px solid #d7dee5; }
  .badge { font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 6px;
           vertical-align: 2px; }
  .badge.ab { background: rgba(255,188,68,.18); color: #b96e00; border: 1px solid rgba(255,188,68,.6); }
  .badge.secure { background: rgba(217,58,58,.1); color: #c0392b;
                  border: 1px solid rgba(217,58,58,.5); font-size: 12px;
                  border-radius: 6px; padding: 1px 9px; vertical-align: 0; margin-left: 5px; }
  .btn { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px;
         text-decoration: none; color: #03353f; border: 1px solid #d7dee5; background: #fff; }
  .btn.primary { background: #8dc215; border-color: #8dc215; color: #fff; font-weight: 600; }
  /* secure-profile artifacts: yellow instead of green */
  .btn.secure { background: #ffbc44; border-color: #ffbc44; color: #03353f; font-weight: 600; }
  .btn:hover { filter: brightness(.96); }
  .loading { color: #7b8fa0; padding: 30px 0; }

  /* ── slot (<details>) blocks: previous / pre-release ── */
  details.slot { background: #fff; border-radius: 14px; margin: 22px 0;
                 box-shadow: 0 1px 4px rgba(3,53,63,.08); overflow: hidden; }
  details.slot > summary { display: flex; align-items: center; gap: 12px;
                           padding: 15px 24px; cursor: pointer; list-style: none;
                           user-select: none; font-size: 14px; }
  details.slot > summary::-webkit-details-marker { display: none; }
  details.slot > summary:hover { background: #fafbfd; }
  details.slot[open] > summary { border-bottom: 1px solid #eef2f6; }
  .badge.slotlatest { background: rgba(141,194,21,.15); color: #5a7d0a;
                      border: 1px solid rgba(141,194,21,.55); font-size: 12px;
                      border-radius: 6px; padding: 1px 9px; vertical-align: 0; }
  .badge.slotpre { background: rgba(255,188,68,.18); color: #b96e00;
                   border: 1px solid rgba(255,188,68,.6); font-size: 12px;
                   border-radius: 6px; padding: 1px 9px; vertical-align: 0; }
  .badge.slotprev { background: rgba(3,53,63,.06); color: #51707c;
                    border: 1px solid rgba(3,53,63,.22); font-size: 12px;
                    border-radius: 6px; padding: 1px 9px; vertical-align: 0; }
  .slotdate { color: #7b8fa0; font-size: 13px; }
  .chev { margin-left: auto; color: #7b8fa0; transition: transform .15s; }
  details.slot[open] .chev { transform: rotate(90deg); }
  .slot-body { padding: 2px 24px 10px; }
  .slot-body .board { margin: 16px 0 8px; }
  .slot-note { color: #7b8fa0; font-size: 13px; padding: 12px 2px 0; }

  @media (max-width: 720px) { .board { flex-direction: column; } .photo { flex: none; } }
</style>
</head>
<body>
<header><main>
  <h1>Seeed <em>reComputer</em> — Armbian Images</h1>
  <nav id="slotnav" class="slotnav" hidden></nav>
</main></header>
<main>
  <div id="boards" class="loading">Fetching releases from GitHub…</div>
  <div id="slots"></div>
</main>

<script>
"use strict";
const CFG = Object.freeze({ repo: "$PAGE_REPO" });

// ── Embedded data ──────────────────────────────────────────────────
// Render time: the pages walk reads the OneDrive mirror (every file's
// share link + the per-slot tag files) and fetches the release list,
// then embeds all three here. Page renders entirely from embedded data
// — no runtime API calls needed.
const LINKS = $PAGE_LINKS;
const RELEASES = $PAGE_RELEASES;
const SLOTS = $PAGE_SLOTS;

const BOARD_PAT = /Recomputer-([A-Za-z0-9][A-Za-z0-9-]*?)_/;
const VER_PAT = /^Armbian[^_]*_([^_]+)/;               // Armbian[-unofficial]_26.11.0-trunk_…
const REL_PAT = /_([a-z]+)_vendor_([0-9][\w.-]*?)_/;   // …_resolute_vendor_6.1.172_…
const VARIANT_TITLE = { cli: "CLI", desktop: "Desktop" };
const ROW_LABEL = { img: "Image", ota: "OTA",
                    sha256: "sha256", sha: "sha256", chk: "checksum" };
// button groups, rendered with a separator between each pair;
// Build info (txt) is not a button — it lives on the meta line
const GROUPS = [["img", "sha256"], ["ota", "chk"]];

function parse(name, size, url, secure, lk) {
  const m = name.match(BOARD_PAT);
  if (!m) return null;
  const board = m[1];
  const variant = name.indexOf("_gnome_desktop") >= 0 ? "desktop"
                : name.indexOf("_minimal") >= 0 ? "cli" : null;
  if (!variant) return null;
  const mode = name.indexOf("_AB_PART") >= 0 ? "ab" : "recovery";
  const crypt = name.indexOf("-crypt") >= 0;
  let kind = null;
  // .img.sha is armbian's own checksum of the unpacked .img — redundant
  // next to the .img.xz.sha256 we generate; skip it.
  if (name.endsWith(".img.sha")) return null;
  if (name.endsWith(".img.xz.sha256")) kind = "sha256";
  else if (name.endsWith(".img.xz")) kind = "img";
  else if (name.endsWith(".img.txt")) kind = "txt";
  // The outer package shell compresses with the payload codec, so the
  // suffix is .tar.gz / .tar.xz / .tar.zst — match the stem, not one
  // hard-coded codec (port of the seeed-build.yml fix bc6f90e5).
  else if (name.includes("_OTA.tar.")) kind = "ota";
  else if (name.endsWith("_OTA.checksums")) kind = "chk";
  else if (name.endsWith(".sha256")) kind = "sha256";
  if (!kind) return null;
  // version metadata, extracted from the self-describing filename:
  // version "26.11.0-trunk" → "26.11.0"; release codename + kernel
  const vm = name.match(VER_PAT);
  const rm = name.match(REL_PAT);
  // secure comes from the mirror's "<profile>-secure-boot/" dir, not the
  // filename — plain and secure builds share identical filenames by design.
  return { board: board, variant: variant, mode: mode, crypt: crypt,
           secure: !!secure, lk: lk,
           kind: kind, name: name, size: size, url: url,
           ver: vm ? vm[1].replace(/-.*$/, "") : "",
           release: rm ? rm[1] : "",
           kernel: rm ? rm[2] : "" };
}

function boardImage(board) {
  return "https://armbian.com/api/v1/images/boards/480/recomputer-"
       + board.replace("-dev-kit", "-devkit") + ".png";
}

// canonical board display order — mirrors the build-images.yml input
// order (rk3576 variants grouped, rk3588 last); unknown boards append
const BOARD_ORDER = ["rk3576-devkit", "rk3576-module-devkit",
                     "rk3576-industrial", "rk3588-devkit"];
const boardRank = b => { const i = BOARD_ORDER.indexOf(b); return i < 0 ? BOARD_ORDER.length : i; };

function group(assets) {
  const map = new Map();
  for (const a of assets || []) {
    const r = parse(a.name, a.size, a.browser_download_url, a.secure, a.lk);
    if (!r) continue;
    // secure joins the key: plain and secure twins share the filename, so
    // without it one silently overwrites the other's links.
    const key = [r.board, r.variant, r.mode, r.crypt, r.secure].join("\t");
    if (!map.has(key))
      map.set(key, { board: r.board, variant: r.variant, mode: r.mode,
                     crypt: r.crypt, secure: r.secure, ver: r.ver, release: r.release,
                     kernel: r.kernel, odboard: (a && a.board) || "", d: {} });
    map.get(key).d[r.kind] = { name: r.name, size: a.size, url: a.browser_download_url, lk: a.lk };
  }
  const rank = e => (e.variant === "cli" ? 0 : 4)
                  + (e.mode === "recovery" ? 0 : 2) + (e.crypt ? 1 : 0);
  return [...map.values()].sort((x, y) => {
    const bx = boardRank(x.board), by = boardRank(y.board);
    if (bx !== by) return bx - by;
    return x.board < y.board ? -1 : x.board > y.board ? 1 : rank(x) - rank(y);
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// opts: {suppressAb, suppressCrypt, secure} — badge/box-title redundancy
// control and the yellow secure button style
function buildRow(entry, opts, slot) {
  // head: bold variant + gray " - codename - armbian version - kernel" meta
  // + "Build info" text link (build metadata, not a downloadable artifact)
  const head = el("div", "row-head");
  const title = el("span", "row-title", VARIANT_TITLE[entry.variant]);
  if (entry.mode === "ab" && !opts.suppressAb)
    title.appendChild(el("span", "badge ab", "A/B"));
  const meta = [entry.release, entry.ver, entry.kernel].filter(Boolean).join(" - ");
  if (meta) head.appendChild(el("span", "row-meta", "- " + meta));
  if (entry.d && entry.d.txt) {
    const v = entry.d.txt;
    const a = el("a", "row-info", "Build info");
    a.href = (v.lk && LINKS[v.lk]) || v.url || "#";
    a.target = "_blank";
    a.rel = "noopener";
    head.appendChild(a);
  }
  head.prepend(title);

  // links: [Image sha256] | [OTA checksum] — groups split by a vertical
  // rule; no sizes; primary buttons go yellow in Secure boxes
  const links = el("div", "row-links");
  for (const group of GROUPS) {
    const present = group.filter(k => entry.d && entry.d[k]);
    if (!present.length) continue;
    const grp = el("span", "grp");
    for (const kind of present) {
      const v = entry.d[kind];
      const primary = kind === "img" || kind === "ota";
      const cls = primary ? (opts.secure ? "btn secure" : "btn primary") : "btn";
      const a = el("a", cls, ROW_LABEL[kind]);
      // Use the embedded share link from the build-time rclone walk via
      // the exact LINKS key carried on the asset — filenames repeat across
      // profile dirs, so a lookup by name can grab the twin's link.
      a.href = (v.lk && LINKS[v.lk]) || v.url || "#";
      grp.appendChild(a);
    }
    links.appendChild(grp);
  }

  const row = el("div", "row");
  row.append(head, links);
  return row;
}

function buildModeBox(title, subtitle, entries, opts, slot) {
  const box = el("div", "modebox");
  const h3 = el("h3");
  h3.appendChild(document.createTextNode(title));
  if (opts.secure) h3.appendChild(el("span", "badge secure", "Secure"));
  h3.appendChild(el("span", "boxsub", " - " + subtitle));
  box.appendChild(h3);
  for (const entry of entries) box.appendChild(buildRow(entry, opts, slot));
  return box;
}

function buildSection(board, entries, slot) {
  const sec = el("section", "board");

  // photo column: board name ABOVE the photo, large
  const photo = el("div", "photo");
  const cap = el("div", "caption", "reComputer ");
  cap.appendChild(el("span", null, board));
  photo.appendChild(cap);
  const img = document.createElement("img");
  img.src = boardImage(board);
  img.alt = "reComputer " + board;
  img.loading = "lazy";
  img.onerror = () => photo.classList.add("noimg");
  photo.appendChild(img);

  // downloads: mode × secure → up to four boxes, stacked:
  // Recovery / A/B / Recovery Secure / A/B Secure (each only if non-empty).
  // secure = the mirror's -secure-boot profile dir (see slotAssets) — NOT
  // the -crypt filename marker, which is encryption and self-describes.
  const rec  = entries.filter(e => e.mode !== "ab" && !e.secure);
  const ab   = entries.filter(e => e.mode === "ab" && !e.secure);
  const recS = entries.filter(e => e.mode !== "ab" && e.secure);
  const abS  = entries.filter(e => e.mode === "ab" && e.secure);
  const boxes = el("div", "modeboxes");
  boxes.appendChild(buildModeBox("Recovery", "Single partition", rec,
                                 { suppressAb: false }, slot));
  if (ab.length)
    boxes.appendChild(buildModeBox("A/B", "Dual partition", ab,
                                   { suppressAb: true }, slot));
  if (recS.length)
    boxes.appendChild(buildModeBox("Recovery", "Single partition", recS,
                                   { secure: true }, slot));
  if (abS.length)
    boxes.appendChild(buildModeBox("A/B", "Dual partition", abS,
                                   { suppressAb: true, secure: true }, slot));

  const info = el("div", "info");
  info.append(boxes);

  sec.append(photo, info);
  return sec;
}

function fmtDate(iso) {
  return iso ? iso.slice(0, 10) + " " + iso.slice(11, 16) + " UTC" : "";
}

/* ── slot derivation ──────────────────────────────────────────────────
   Ground truth (OneDrive mode): the mirror's per-slot tag files, read
   at render time into SLOTS as {"latest"|"previous"|"pre-release": tag}.
   A slot renders iff its tag exists. RELEASES only joins in per-tag
   metadata (publish date, GitHub link). */
const SLOT_DIRS = { latest: "latest", pre: "pre-release", prev: "previous" };

function mirrorSlot(kind) {
  const t = SLOTS[SLOT_DIRS[kind]];
  if (!t) return null;
  const rel = (RELEASES || []).find(r => String(r.tag_name) === String(t));
  // Synthesize when the tag matches no release (release deleted after
  // promotion): the slot still renders, just without a date.
  return rel || { tag_name: t, prerelease: SLOT_DIRS[kind] === "pre-release",
                  published_at: null };
}

// Fallback (fork mode — SLOTS={} because the mirror walk never ran):
// infer the slots from the /releases list alone.
function slotsFrom(list) {
  const fulls = [], pres = [];
  for (const r of list || []) (r.prerelease ? pres : fulls).push(r);
  const latest = fulls[0] || null;      // list is newest-first
  const previous = fulls[1] || null;
  let pre = pres[0] || null;
  // tags are YYMMDD-HHMM → lexicographic compare = chronological.
  // A prerelease older than latest means "already promoted" → hide it.
  if (pre && latest && String(pre.tag_name) <= String(latest.tag_name)) pre = null;
  return { latest: latest, previous: previous, pre: pre };
}

// OneDrive-mode: the build-time rclone walk embeds every file under every
// slot as LINKS — no runtime fetch needed (CORS blocks github.io →
// github.com asset fetches).
function slotAssets(slotDir) {
  // Keys are "<slot>/<board>/<profile>[-secure-boot]/[ota/]<file>".
  // Scope to this slot's subtree so the three slot sections don't all
  // render the whole mirror; the -secure-boot profile dir is the ONLY
  // secure marker (filenames are identical across profiles) — carry it
  // into `secure` and keep the key on the asset for exact link lookups.
  // Size is 0 (rclone link doesn't report it).
  return Object.keys(LINKS)
    .filter(path => path.startsWith(slotDir + "/") && path !== slotDir + "/tag")
    .map(path => ({
      name: path.split("/").pop(),
      size: 0,
      browser_download_url: LINKS[path],
      secure: (path.split("/")[2] || "").endsWith("-secure-boot"),
      lk: path,
    }));
}

async function splitBoards(rel, slotDir) {
  const sections = new Map();
  for (const e of group(slotAssets(slotDir))) {
    if (!sections.has(e.board)) sections.set(e.board, []);
    sections.get(e.board).push(e);
  }
  return sections;
}

async function buildSlot(rel, kind, slotDir) {  // kind: "latest" | "pre" | "prev"
  const det = document.createElement("details");
  det.className = "slot";
  det.id = "slot-" + kind;
  det.open = kind === "latest";  // latest starts expanded; others collapsed

  const look = {
    latest: ["badge slotlatest", "✅ Stable"],
    pre:    ["badge slotpre",    "🧪 Pre-release"],
    prev:   ["badge slotprev",   "⏱ Previous"]
  }[kind];
  // No stable yet: pre-release shown in the expanded "latest" slot
  const badge = (kind === "latest" && rel.prerelease)
    ? ["badge slotpre", "🧪 Pre-release"] : look;
  const sum = el("summary");
  sum.appendChild(el("span", badge[0], badge[1]));
  // tag links to the release page on GitHub; interactive elements inside
  // <summary> follow their activation without toggling the details
  const tag = el("a", "tag", rel.tag_name);
  tag.href = "https://github.com/" + CFG.repo + "/releases/tag/" + rel.tag_name;
  tag.title = "GitHub release";
  tag.target = "_blank";   // open in a new tab, don't navigate away
  tag.rel = "noopener";
  sum.appendChild(tag);
  sum.appendChild(el("span", "slotdate", fmtDate(rel.published_at)));
  sum.appendChild(el("span", "chev", "▸"));

  const body = el("div", "slot-body");
  if (kind === "pre" || (kind === "latest" && rel.prerelease))
    body.appendChild(el("div", "slot-note",
      "Build completed on all boards — pending on-device verification before promotion to stable."));
  const sections = await splitBoards(rel, slotDir);
  // Empty slot (no assets parse into boards) → hide entirely. This happens
  // for stale/foreign releases whose assets don't match our naming scheme.
  if (sections.size === 0) return null;
  for (const [b, es] of sections)
    body.appendChild(buildSection(b, es, slotDir));

  det.append(sum, body);
  return det;
}

async function boot() {
  const boards = document.getElementById("boards");
  try {
    // Use embedded render-time data only — no runtime GitHub API call.
    // Mirror tag files bind the slots when present (OneDrive mode);
    // release-list inference is the fallback (fork mode: SLOTS={}).
    const hasMirror = !!(SLOTS && (SLOTS.latest || SLOTS["pre-release"] || SLOTS.previous));
    const s = hasMirror
      ? { latest: mirrorSlot("latest"), pre: mirrorSlot("pre"), previous: mirrorSlot("prev") }
      : slotsFrom(RELEASES);
    if (!s.latest && !s.pre) throw new Error("no releases yet");

    boards.hidden = true;  // all three slots render as collapsible bars below
    const slots = document.getElementById("slots");
    // Build slots; buildSlot returns null for empty ones → skip them.
    // No stable yet: show pre-release expanded in the "latest" position.
    const slotEls = [];
    if (!s.latest && s.pre) {
      const d = await buildSlot(s.pre, "latest", "pre-release");
      if (d) slotEls.push(d);
    } else {
      if (s.latest)   { const d = await buildSlot(s.latest, "latest", "latest");   if (d) slotEls.push(d); }
      if (s.pre)      { const d = await buildSlot(s.pre, "pre", "pre-release");    if (d) slotEls.push(d); }
      if (s.previous) { const d = await buildSlot(s.previous, "prev", "previous"); if (d) slotEls.push(d); }
    }
    if (!slotEls.length) throw new Error("no renderable releases");
    slots.replaceChildren(...slotEls);

    // anchor nav under the title — only slots that actually rendered
    const nav = document.getElementById("slotnav");
    nav.replaceChildren();
    const navItems = !s.latest
      ? [["latest", "Pre-release"]]  // no stable yet: only pre-release
      : [["latest", "Stable"], ["pre", "Pre-release"], ["prev", "Previous"]];
    for (const [kind, label] of navItems) {
      const rel = kind === "prev" ? s.previous : s[kind];  // field is "previous"
      if (!rel) continue;
      if (!document.getElementById("slot-" + kind)) continue;  // slot was skipped
      const a = el("a", kind, label);   // class latest|pre|prev → pill color
      a.href = "#slot-" + kind;
      a.onclick = () => { const d = document.getElementById("slot-" + kind);
                          if (d) d.open = true; };
      nav.appendChild(a);
    }
    nav.hidden = nav.children.length === 0;
  } catch (e) {
    boards.hidden = false;
    boards.textContent = "⚠ No releases available. Please check back later.";
  }
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
