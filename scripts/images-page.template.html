<!DOCTYPE html>
<!--
  Images download page — static template.

  Rendered by release-onedrive.yml's pages job with envsubst; the ONLY
  substitutions are $PAGE_REPO (release repo, for the API fetch) and
  $PAGE_OD (OneDrive mirror URL). Everything release-specific — tag, date,
  asset list — is fetched client-side from /releases/latest at browse
  time, so the rendered page never goes stale between pushes.

  The inline JS deliberately uses no backtick template literals: ${...}
  sequences would collide with envsubst. Keep it that way.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeed reComputer — Armbian 镜像下载</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.65 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
         background: #f3f5f8; color: #03353f; }
  header { background: #03353f; color: #fff; padding: 34px 0 30px; }
  header .bar { width: 56px; height: 5px; background: #8dc215; border-radius: 3px;
                margin-bottom: 16px; }
  main { max-width: 920px; margin: 0 auto; padding: 0 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .5px; }
  h1 em { color: #8dc215; font-style: normal; }
  .sub { color: #b9cdd4; font-size: 14px; }
  .tag { display: inline-block; background: rgba(141,194,21,.18); color: #8dc215;
         border: 1px solid rgba(141,194,21,.55); border-radius: 6px; padding: 0 8px;
         font: 12px/1.7 ui-monospace, "SF Mono", monospace; }
  .board { display: flex; gap: 26px; background: #fff; border-radius: 14px;
           padding: 24px; margin: 22px 0; box-shadow: 0 1px 4px rgba(3,53,63,.08); }
  .photo { flex: 0 0 300px; }
  .photo img { width: 100%; border-radius: 10px; background: #fff; mix-blend-mode: multiply; }
  .photo.noimg { display: none; }
  .info { flex: 1; min-width: 0; }
  h2 { font-size: 20px; margin: 2px 0 14px; }
  h2 span { color: #8dc215; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 9px 0;
         border-top: 1px solid #eef2f6; flex-wrap: wrap; }
  .row-title { flex: 0 0 64px; font-weight: 600; font-size: 14px; }
  .row-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 6px;
           vertical-align: 2px; }
  .badge.ab { background: rgba(255,188,68,.18); color: #b96e00; border: 1px solid rgba(255,188,68,.6); }
  .badge.crypt { background: rgba(3,53,63,.08); color: #03353f; border: 1px solid rgba(3,53,63,.25); }
  .btn { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px;
         text-decoration: none; color: #03353f; border: 1px solid #d7dee5; background: #fff; }
  .btn.primary { background: #8dc215; border-color: #8dc215; color: #fff; font-weight: 600; }
  .btn:hover { filter: brightness(.96); }
  .onedrive { display: inline-block; margin-top: 14px; text-decoration: none; font-size: 14px;
              color: #03353f; border: 1px dashed #8dc215; border-radius: 8px; padding: 5px 14px; }
  .loading { color: #7b8fa0; padding: 30px 0; }
  .fallback { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
              background: #fff; border: 1px solid #ffd9a0; border-radius: 14px;
              padding: 18px 24px; margin: 22px 0; font-size: 14px; }
  .fallback[hidden] { display: none; }
  footer { margin: 40px 0 60px; color: #7b8fa0; font-size: 13px; line-height: 2; }
  footer code { background: #e8edf2; padding: 1px 7px; border-radius: 4px; font-size: 12px; }
  @media (max-width: 720px) { .board { flex-direction: column; } .photo { flex: none; } }
</style>
</head>
<body>
<header><main>
  <div class="bar"></div>
  <h1>Seeed <em>reComputer</em> — Armbian 镜像</h1>
  <div class="sub" id="sub">当前正式版 <span class="tag" id="tag">…</span> &nbsp;·&nbsp; <span id="date"></span></div>
</main></header>
<main>
  <div id="boards" class="loading">正在从 GitHub 获取最新版本…</div>

  <div id="fallback" class="fallback" hidden>
    <span>⚠ 实时获取最新版信息失败或暂无正式版。可以从这里直接下载：</span>
    <a class="btn primary" href="https://github.com/$PAGE_REPO/releases/latest">GitHub Releases</a>
    <a class="btn primary" href="$PAGE_OD">☁ OneDrive 下载全部</a>
  </div>
  <noscript>
    <div class="fallback">
      <span>本页需要 JavaScript 从 GitHub 实时获取最新版本，也可直接下载：</span>
      <a class="btn primary" href="https://github.com/$PAGE_REPO/releases/latest">GitHub Releases</a>
      <a class="btn primary" href="$PAGE_OD">☁ OneDrive 下载全部</a>
    </div>
  </noscript>

  <footer>
    写入 eMMC/SD：<code>xz -d -T0 xxx.img.xz</code> 后用 <code>dd</code> 或 balenaEtcher 烧写。
  </footer>
</main>

<script>
"use strict";
// Ported from scripts/gen-images-page.py (same filename grammar, same layout).
//
// Filename grammar (armbian image names self-describe everything):
//   …_Recomputer-<board>_<release>_vendor_<kernel>_<variant>[_AB_PART|-crypt].…
//     board   — captured verbatim (rk3576-devkit, rk3576-industrial, …)
//     variant — trailing "_minimal" → cli, "_gnome_desktop" → desktop
//               (NOT the release token: noble/trixie/resolute only say the distro)
//     mode    — "_AB_PART" → A/B, otherwise recovery
//     crypt   — "-crypt" → encrypted image
//     OTA     — "<base>_OTA.tar.gz" / "<base>_OTA.checksums"
const CFG = Object.freeze({ repo: "$PAGE_REPO", onedrive: "$PAGE_OD" });

const BOARD_PAT = /Recomputer-([A-Za-z0-9][A-Za-z0-9-]*?)_/;
const VARIANT_TITLE = { cli: "CLI", desktop: "桌面" };
const ROW_LABEL = { img: "镜像", ota: "OTA 包",
                    sha256: "sha256", sha: "sha", chk: "校验", txt: "构建信息" };
const KIND_ORDER = ["img", "ota", "sha256", "sha", "chk", "txt"];

function parse(name, size, url) {
  const m = name.match(BOARD_PAT);
  if (!m) return null;
  const board = m[1];
  const variant = name.indexOf("_gnome_desktop") >= 0 ? "desktop"
                : name.indexOf("_minimal") >= 0 ? "cli" : null;
  if (!variant) return null;
  const mode = name.indexOf("_AB_PART") >= 0 ? "ab" : "recovery";
  const crypt = name.indexOf("-crypt") >= 0;
  let kind = null;
  if (name.endsWith(".img.xz.sha256")) kind = "sha256";
  else if (name.endsWith(".img.xz")) kind = "img";
  else if (name.endsWith(".img.sha")) kind = "sha";
  else if (name.endsWith(".img.txt")) kind = "txt";
  else if (name.endsWith("_OTA.tar.gz")) kind = "ota";
  else if (name.endsWith("_OTA.checksums")) kind = "chk";
  else if (name.endsWith(".sha256")) kind = "sha256";
  if (!kind) return null;
  return { board: board, variant: variant, mode: mode, crypt: crypt,
           kind: kind, name: name, size: size, url: url };
}

function human(n) {
  n = Number(n);
  for (const unit of ["B", "K", "M", "G"]) {
    if (n < 1024 || unit === "G")
      return (unit === "B" || unit === "K") ? Math.trunc(n) + unit : n.toFixed(1) + unit;
    n /= 1024;
  }
}

function boardImage(board) {
  // armbian.com names the module image …-module-devkit (no inner dash)
  return "https://armbian.com/api/v1/images/boards/480/recomputer-"
       + board.replace("-dev-kit", "-devkit") + ".png";
}

// assets[] → entries[] in display order: board asc, then cli→desktop,
// recovery→ab, plain→crypt. Each entry carries its kind→asset map.
function group(assets) {
  const map = new Map();  // key → entry
  for (const a of assets || []) {
    const r = parse(a.name, a.size, a.browser_download_url);
    if (!r) continue;
    const key = [r.board, r.variant, r.mode, r.crypt].join("\t");
    if (!map.has(key))
      map.set(key, { board: r.board, variant: r.variant, mode: r.mode,
                     crypt: r.crypt, d: {} });
    map.get(key).d[r.kind] = { name: r.name, size: r.size, url: a.browser_download_url };
  }
  const rank = e => (e.variant === "cli" ? 0 : 4)
                  + (e.mode === "recovery" ? 0 : 2) + (e.crypt ? 1 : 0);
  return [...map.values()].sort((x, y) =>
    x.board < y.board ? -1 : x.board > y.board ? 1 : rank(x) - rank(y));
}

// --- DOM rendering (createElement/textContent only; asset names and URLs
// --- never pass through an HTML parser, so no escaping needed).
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildRow(entry) {
  const title = el("div", "row-title", VARIANT_TITLE[entry.variant]);
  if (entry.mode === "ab") title.appendChild(el("span", "badge ab", "A/B"));
  if (entry.crypt) title.appendChild(el("span", "badge crypt", "加密"));

  const links = el("div", "row-links");
  for (const kind of KIND_ORDER) {
    const v = entry.d[kind];
    if (!v) continue;
    const primary = kind === "img" || kind === "ota";
    const a = el("a", primary ? "btn primary" : "btn",
                 ROW_LABEL[kind] + (primary ? " · " + human(v.size) : ""));
    a.href = v.url;  // https-only browser_download_url from the GitHub API
    links.appendChild(a);
  }

  const row = el("div", "row");
  row.append(title, links);
  return row;
}

function buildSection(board, entries) {
  const sec = el("section", "board");

  const photo = el("div", "photo");
  const img = document.createElement("img");
  img.src = boardImage(board);
  img.alt = "reComputer " + board;
  img.loading = "lazy";
  img.onerror = () => photo.classList.add("noimg");
  photo.appendChild(img);

  const dl = el("div", "downloads");
  for (const entry of entries) dl.appendChild(buildRow(entry));

  const od = el("a", "onedrive", "☁ OneDrive 下载全部");
  od.href = CFG.onedrive;

  const info = el("div", "info");
  const h2 = el("h2", null, "reComputer ");
  h2.appendChild(el("span", null, board));
  info.append(h2, dl, od);

  sec.append(photo, info);
  return sec;
}

function fmtDate(iso) {
  return iso ? iso.slice(0, 10) + " " + iso.slice(11, 16) + " UTC" : "";
}

async function boot() {
  const boards = document.getElementById("boards");
  const sub = document.getElementById("sub");
  const fallback = document.getElementById("fallback");
  let rel;
  try {
    // /releases/latest skips pre-releases and drafts — matches the
    // "page appears on promotion" semantics of the old generated page.
    const r = await fetch("https://api.github.com/repos/" + CFG.repo + "/releases/latest",
                          { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    rel = await r.json();
  } catch (e) {
    boards.hidden = true;
    sub.hidden = true;
    fallback.hidden = false;
    return;
  }
  const entries = group(rel.assets);
  if (!entries.length) {
    boards.hidden = true;
    sub.hidden = true;
    fallback.hidden = false;
    return;
  }
  document.getElementById("tag").textContent = rel.tag_name;
  document.getElementById("date").textContent = fmtDate(rel.published_at);
  // entries are sorted board-asc; split into one section per board
  const sections = new Map();  // board → entries[]
  for (const e of entries) {
    if (!sections.has(e.board)) sections.set(e.board, []);
    sections.get(e.board).push(e);
  }
  boards.className = "";
  boards.replaceChildren(...[...sections].map(([b, es]) => buildSection(b, es)));
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
